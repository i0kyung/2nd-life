<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>제2의 인생 · 청년기</title>
<style>
/* ============================================================
   「제2의 인생」 stage_high.html — 고등학생
   레이아웃 골격 v2: 보드가 화면 테두리를 두르고, 가운데가 무대.
   ------------------------------------------------------------
   설계 원칙
   1) 선택지는 무대 안에 있다. 구조적으로 아래로 밀려날 수 없다.
   2) 색은 장식이 아니라 신호다. 메인 1색 + 무채색 + 의미색 3.
      칸은 전부 무채색. 내 위치·목적지만 켜진다.
   3) 글자를 줄인다. 스탯 이름은 아이콘, 로그는 1줄.
   ============================================================ */
:root{
  /* 메인 1색 — 나 / 지금 / 핵심 행동 */
  --main:#4F7CFF;
  --main-weak:rgba(79,124,255,.12);
  --main-line:rgba(79,124,255,.34);

  /* 상대 — 무채색 계열로 물러나 있는다 */
  --rival:#8A94B8;
  --rival-weak:rgba(138,148,184,.14);

  /* 의미색 — 오직 상태 전달용. 장식 금지 */
  --pos:#1F9B78;
  --neg:#E0476B;
  --warn:#C98A00;
  --romance:#FF6FB1;
  /* 모달·배지에서 쓰는 보조색 (정의가 빠져 배지가 투명하던 문제) */
  --purple:#7C5CE0; --blue:#4F7CFF; --coral:#FF7A6B; --pink:#FF6FB1;
  --child-bg1:#FFF3F7; --child-bg3:#EEF1FF;

  /* 무채색 스케일 */
  --ink:#1B2340;
  --ink-2:#4A5372;
  --muted:#858DAC;
  --line:rgba(27,35,64,.10);
  --line-2:rgba(27,35,64,.16);
  --card:#FFFFFF;
  --sunk:#F2F4F9;
  --bg:#EEF1F7;

  --r:14px;
  --shadow:0 6px 20px rgba(27,35,64,.09);
  --shadow-up:0 14px 34px rgba(27,35,64,.16);
}

*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  color:var(--ink);
  background:var(--bg);
  overflow:hidden;               /* 스크롤이 생기면 설계가 실패한 것이다 */
}
/* 시대감은 배경 이미지가 담당한다. UI는 조용히 있는다. */
body::before{
  content:"";position:fixed;inset:0;z-index:-1;
  background:url("./image/bg/youth.png") center/cover no-repeat;
  opacity:.5;
}
body::after{
  content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(180deg, rgba(238,241,247,.82), rgba(238,241,247,.94));
}

.loadmask{
  position:fixed;inset:0;z-index:200;display:grid;place-items:center;
  background:var(--bg);color:var(--muted);font-size:14px;font-weight:800;
}

/* ── 전체 골격 ───────────────────────────────────────────── */
.wrap{
  height:100vh;padding:10px 12px;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:8px;
}

/* ── 상단바: 얇게. 제목 + 시대 + 라운드 + 타임라인 ── */
.topbar{
  display:flex;align-items:center;gap:12px;
  padding:0 4px;min-height:34px;
}
.gtitle{font-size:14px;font-weight:900;color:var(--ink);letter-spacing:-.3px;white-space:nowrap;}
.stage-now{
  font-size:12px;font-weight:900;color:var(--main);
  background:var(--main-weak);border-radius:999px;padding:5px 11px;white-space:nowrap;
}
.timeline{display:flex;gap:4px;margin-left:auto;}
.tl{
  font-size:11px;font-weight:800;color:var(--muted);
  padding:4px 7px;border-radius:999px;background:rgba(255,255,255,.6);
  white-space:nowrap;
}
.tl b{display:none;}                        /* 글자 걷어냄: 아이콘만 */
.tl.done{opacity:.4;}
.tl.now{background:var(--main);color:#fff;}
.tl.now b{display:inline;margin-left:4px;font-size:10.5px;}   /* 현재 시대만 이름 표시 */

/* ── 플레이 영역: [나] [보드+무대] [상대] ── */
.play{
  display:grid;
  grid-template-columns:210px minmax(0,1fr) 210px;
  gap:10px;min-height:0;
}

/* ── 좌우 패널 ── */
.pcol{
  background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);
  padding:12px;display:flex;flex-direction:column;gap:10px;min-height:0;
  border-top:3px solid transparent;
}
.pcol.is-user{border-top-color:var(--main);}
.pcol.is-ai{border-top-color:var(--rival);}
.pcol.turn{box-shadow:0 0 0 2px var(--main), var(--shadow-up);}
.pcol.is-ai.turn{box-shadow:0 0 0 2px var(--rival), var(--shadow-up);}

.rc-ava{
  height:145px;border-radius:10px;background:var(--sunk);
  display:flex;align-items:flex-end;justify-content:center;overflow:hidden;flex:0 0 auto;
}
.rc-ava img{width:100%;height:100%;object-fit:contain;}
.pcol.is-ai .rc-ava img, .settle-person.ai .settle-face img{filter:hue-rotate(-32deg) saturate(1.18);transform:scaleX(-1);}
.rc-name{font-size:13px;font-weight:900;color:var(--ink);display:flex;align-items:center;gap:5px;}
.rc-dot{width:7px;height:7px;border-radius:50%;background:var(--main);flex:0 0 auto;}
.is-ai .rc-dot{background:var(--rival);}

/* 스탯: 아이콘 + 게이지 + 등급. 이름 글자 없음 */
.rc-stats{display:flex;flex-direction:column;gap:7px;}
.grade-chip{display:grid;grid-template-columns:15px 1fr 13px;align-items:center;gap:7px;}
.grade-chip svg{width:15px;height:15px;color:var(--muted);flex:0 0 auto;}
.grade-bar{height:5px;border-radius:99px;background:var(--sunk);overflow:hidden;}
.grade-fill{display:block;height:100%;border-radius:99px;background:var(--main);transition:width .3s;}
.is-ai .grade-fill{background:var(--rival);}
.grade-chip b{font-size:10px;font-weight:900;color:var(--muted);text-align:right;}
.grade-chip.flash .grade-fill{background:var(--pos);}
.grade-chip.flash b{color:var(--pos);}

/* 패널 하단 요약: 최소한의 글자만 */
.rc-meta{margin-top:auto;display:flex;flex-direction:column;gap:4px;}
.rc-sub{font-size:11px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:5px;}
.rc-sub b{color:var(--ink-2);font-weight:900;}

/* ── 보드 링: 8열×8행. 테두리 28칸 = HIGH_BOARD 28칸 ── */
.boardring{
  display:grid;
  grid-template-columns:repeat(8, 1fr);
  grid-template-rows:repeat(8, 1fr);
  gap:5px;min-height:0;
}
#miniboard{display:contents;}     /* 칸들이 boardring 격자에 직접 참여 */

/* 시계방향 배치: 상단 8 → 우측 6 → 하단 8(역방향) → 좌측 6(역방향) */
.cell:nth-child(1){grid-area:1/1;}  .cell:nth-child(2){grid-area:1/2;}
.cell:nth-child(3){grid-area:1/3;}  .cell:nth-child(4){grid-area:1/4;}
.cell:nth-child(5){grid-area:1/5;}  .cell:nth-child(6){grid-area:1/6;}
.cell:nth-child(7){grid-area:1/7;}  .cell:nth-child(8){grid-area:1/8;}
.cell:nth-child(9){grid-area:2/8;}  .cell:nth-child(10){grid-area:3/8;}
.cell:nth-child(11){grid-area:4/8;} .cell:nth-child(12){grid-area:5/8;}
.cell:nth-child(13){grid-area:6/8;} .cell:nth-child(14){grid-area:7/8;}
.cell:nth-child(15){grid-area:8/8;} .cell:nth-child(16){grid-area:8/7;}
.cell:nth-child(17){grid-area:8/6;} .cell:nth-child(18){grid-area:8/5;}
.cell:nth-child(19){grid-area:8/4;} .cell:nth-child(20){grid-area:8/3;}
.cell:nth-child(21){grid-area:8/2;} .cell:nth-child(22){grid-area:8/1;}
.cell:nth-child(23){grid-area:7/1;} .cell:nth-child(24){grid-area:6/1;}
.cell:nth-child(25){grid-area:5/1;} .cell:nth-child(26){grid-area:4/1;}
.cell:nth-child(27){grid-area:3/1;} .cell:nth-child(28){grid-area:2/1;}

/* ── 정보 계층 두 겹 ──
   색  = 카테고리 6종. 판을 보는 순간 "무슨 종류인지"가 0.1초에 읽힌다.
   아이콘 = 사건. 같은 색 안에서 "무슨 일이 벌어지는지"가 칸마다 갈린다.
   현재 칸만 풀컬러로 살아난다 — 옅은 팔레트는 배경, 현재 칸은 전경. */
.cell{
  position:relative;border-radius:10px;
  background:var(--c-bg, var(--card));border:1px solid var(--c-line, var(--line));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  min-height:0;overflow:hidden;
  transition:background .2s, border-color .2s, transform .2s, box-shadow .2s;
}
.cell .cn{display:none;}                       /* 칸 번호 글자 걷어냄 */
.cell .cell-ico{font-size:18px;line-height:1;transition:transform .2s;}
.cell .cell-name{
  font-size:9px;font-weight:800;color:var(--c-ink, var(--muted));
  text-align:center;line-height:1.15;padding:0 2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;
}

/* 카테고리 6종 — 옅은 파스텔 고정 팔레트 */
.cell.cat-study  {--c-bg:#F1ECFF; --c-line:#DFD2FF; --c-ink:#6B52B8; --c-main:#7C5CE0;}
.cell.cat-work   {--c-bg:#FFF7DC; --c-line:#FBE7A6; --c-ink:#9A7414; --c-main:#D9A417;}
.cell.cat-love   {--c-bg:#FFEDF4; --c-line:#FFD2E2; --c-ink:#B54B7C; --c-main:#F0629B;}
.cell.cat-event  {--c-bg:#E9F1FF; --c-line:#CEDFFF; --c-ink:#3F63B8; --c-main:#4F7CFF;}
.cell.cat-rest   {--c-bg:#E8F7EE; --c-line:#C6E9D6; --c-ink:#2C7A57; --c-main:#34A06C;}
.cell.cat-branch {--c-bg:#FFF0E3; --c-line:#FFD9BC; --c-ink:#A5601C; --c-main:#E0842A;}

/* 코너 랜드마크: 판의 기둥. 크게, 진하게 */
.cell.corner{border-width:2px;border-radius:14px;}
.cell.corner .cell-ico{font-size:26px;}
.cell.corner .cell-name{font-size:9.5px;font-weight:900;}
/* 시작·도착: 좌측 상단에서 맞닿는 두 칸 */
.cell.cat-start  {--c-bg:#FFF3F7; --c-line:#FFC9DE; --c-ink:#C0417A; --c-main:#FF6FB1;}
.cell.cat-finish {--c-bg:#EAF6F1; --c-line:#B9E3D0; --c-ink:#1F7A57; --c-main:#1F9B78;}

/* 현재 칸: 색이 완전히 살아난다 */
.cell.cur{
  background:var(--c-main, var(--main));
  border-color:var(--c-main, var(--main));
  transform:scale(1.06);z-index:3;
  box-shadow:0 0 0 3px #fff, 0 8px 20px rgba(27,35,64,.22);
  animation:cellGlow 1.8s ease-in-out infinite;
}
.cell.cur .cell-name{color:#fff;}
.cell.cur .cell-ico{transform:scale(1.12);}
.cell.next{
  border-style:dashed;border-color:var(--c-main, var(--main));
  animation:cellNext 1s ease-in-out infinite;
}
.step-badge{
  position:absolute;top:3px;right:3px;
  font-size:8.5px;font-weight:900;color:#fff;background:var(--main);
  border-radius:99px;padding:1px 5px;
}
/* 말 */
.tok{
  position:absolute;bottom:2px;font-size:14px;line-height:1;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.2));
}
.tok.user{left:4px;}
.tok.ai{right:4px;}

/* ── 무대: 격자 가운데. 여기가 선택지의 집 ── */
.stage{
  grid-column:2 / 8;grid-row:2 / 8;
  border-radius:var(--r);
  background:var(--card);
  box-shadow:var(--shadow);
  display:grid;grid-template-rows:auto 1fr auto;
  min-height:0;overflow:hidden;
  position:relative;
  border:1px solid var(--line);
}
/* 상황별 배경: 새 PNG 없이 CSS 그라디언트로 */
.stage::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:var(--situation, linear-gradient(180deg, rgba(79,124,255,.05), transparent 60%));
  transition:background .35s;
}
.stage > *{position:relative;z-index:1;}

/* 무대 머리: 차례 표시 */
.rmid{
  display:flex;align-items:center;gap:8px;
  padding:9px 13px;border-bottom:1px solid var(--line);
  min-height:0;
}
.rmid-turn{font-size:12px;font-weight:900;color:var(--main);white-space:nowrap;}
.rmid-move{font-size:11.5px;font-weight:800;color:var(--ink-2);}
.rmid-move .big{font-size:15px;font-weight:900;color:var(--main);margin-right:5px;}
.rmid-feel{font-size:11px;font-weight:800;color:var(--muted);margin-left:auto;white-space:nowrap;}

/* ── 무대 본문 ──
   좌우 2단 카드가 아니라 레이어다.
   뒤: 시대 배경 + 사건 아이콘 워터마크 / 가운데: 배우가 바닥에 선다 / 위: 말풍선 */
.scene{
  position:relative;display:grid;grid-template-rows:auto 1fr;
  min-height:0;padding:10px 14px 0;overflow:hidden;
}
/* 뒤 레이어: 시대 배경. 새 PNG 없이 이미 있는 bg/youth.png를 옅게 깐다 */
.scene-bg{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background:url("./image/bg/youth.png") center/cover no-repeat;
  opacity:.14;
  -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 92%);
          mask-image:linear-gradient(180deg,#000 40%,transparent 92%);
}
/* 사건 아이콘 워터마크: 이 칸이 무슨 일인지 무대 뒤에 크게 */
.scene-ico{
  position:absolute;right:16px;top:50%;transform:translateY(-52%);
  font-size:132px;line-height:1;z-index:0;pointer-events:none;
  opacity:.09;filter:saturate(.7);
  transition:opacity .35s, transform .35s;
}
.scene > *:not(.scene-bg):not(.scene-ico){position:relative;z-index:1;}

.scene-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.scene-chip{
  font-size:10.5px;font-weight:900;color:#fff;
  background:var(--stage-main, var(--main));border-radius:99px;padding:3px 10px;
  transition:background .35s;
}
.turn-count{font-size:10.5px;font-weight:800;color:var(--muted);margin-left:auto;}

/* 무대: 배우는 아래, 말풍선은 위 */
.scene-stage{
  position:relative;min-height:0;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  gap:6px;padding-bottom:4px;
}
/* 바닥: 배우가 떠 있지 않게 그림자를 깐다 */
.scene-stage::after{
  content:"";position:absolute;bottom:2px;left:50%;transform:translateX(-50%);
  width:150px;height:13px;border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(27,35,64,.20), transparent 70%);
  pointer-events:none;
}
.scene-bubble{
  position:relative;max-width:86%;
  background:rgba(255,255,255,.95);border:1px solid var(--line);
  border-radius:15px;padding:9px 14px;
  box-shadow:0 6px 18px rgba(27,35,64,.10);
  animation:bubblePop .32s cubic-bezier(.2,1.3,.4,1) both;
}
.scene-bubble::after{        /* 말풍선 꼬리 */
  content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
  width:12px;height:12px;background:rgba(255,255,255,.95);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);
}
.hero-body{
  height:100%;max-height:196px;min-height:0;
  display:flex;align-items:flex-end;justify-content:center;
  animation:heroBreathe 3.4s ease-in-out infinite;
}
.hero-body img{height:100%;width:auto;max-width:100%;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(27,35,64,.16));}
.hero-ava{height:100%;display:flex;align-items:flex-end;justify-content:center;}
.hero-ava img{height:100%;width:auto;object-fit:contain;}
/* 표정 교체: 크로스페이드 */
.hero-body.react img{animation:faceSwap .42s ease both;}
.scene-say{font-size:14.5px;font-weight:900;color:var(--ink);line-height:1.4;text-align:center;}
.scene-sub{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.45;margin-top:3px;text-align:center;}

/* 연애 장면: 둘이 마주 선다 */
.romance-faces{display:flex;align-items:flex-end;justify-content:center;gap:10px;width:100%;height:100%;}
.rf-me,.rf-npc{height:100%;max-height:176px;display:flex;align-items:flex-end;justify-content:center;}
.rf-me img,.rf-npc img{height:100%;width:auto;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(27,35,64,.16));transition:filter .3s, transform .3s;}
.rf-npc.glow img{filter:drop-shadow(0 0 14px rgba(240,98,155,.55));transform:translateY(-4px);}
.rf-npc.dim img{filter:grayscale(.55) opacity(.72);}
.rf-heart{font-size:22px;align-self:center;}
.rf-heart.beat{animation:heartBeat 1s ease-in-out infinite;}
.rf-heart.far{opacity:.5;}

/* ── 선택지: 무대 안. 밀려날 수 없다 ── */
.action-panel{padding:11px 14px 13px;}
.ap-label{font-size:11px;font-weight:800;color:var(--muted);margin-bottom:7px;}
.act-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;}
.btn{border:none;cursor:pointer;font-family:inherit;font-weight:900;border-radius:10px;
     transition:transform .1s, background .15s, border-color .15s;}
.btn:active{transform:translateY(2px);}
.act-btn{
  background:var(--card);border:1.5px solid var(--line-2);color:var(--ink);
  padding:10px 9px;font-size:12.5px;min-height:56px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;
}
.act-btn .ai{font-size:17px;line-height:1;}
.act-btn:hover{border-color:var(--main);background:var(--main-weak);}
.act-btn.big,.btn-roll{
  background:var(--main);color:#fff;border:none;font-size:14px;min-height:48px;width:100%;
  flex-direction:row;gap:7px;
}
.act-btn.big:hover,.btn-roll:hover{background:#3F6AEB;}
/* 상대 차례: 하나가 켜지고 나머지는 물러난다 */
.act-btn.ai-thinking{opacity:.85;cursor:default;pointer-events:none;}
.act-btn.ai-picked{border-color:var(--rival);background:var(--rival-weak);opacity:1;}
.act-btn.ai-dim{opacity:.3;}
.wait-ai{font-size:12px;font-weight:800;color:var(--muted);text-align:center;padding:14px;}

/* ── 로그: 1줄만. 나머지는 접힘 ── */
.logbar{
  display:flex;align-items:center;gap:8px;
  padding:6px 12px;border-radius:10px;
  background:rgba(255,255,255,.7);min-height:30px;
}
.log{flex:1;min-width:0;overflow:hidden;}
.logitem{
  font-size:11.5px;font-weight:800;color:var(--ink-2);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.logitem:not(:first-child){display:none;}     /* 최근 1줄만 */
.log.open{max-height:120px;overflow-y:auto;}
.log.open .logitem{display:block;white-space:normal;padding:2px 0;}
.log-toggle{
  font-size:10.5px;font-weight:900;color:var(--muted);background:none;border:none;
  cursor:pointer;padding:3px 7px;border-radius:6px;white-space:nowrap;
}
.log-toggle:hover{background:var(--sunk);color:var(--main);}

/* ── 모달 ── */
.overlay{
  position:fixed;inset:0;z-index:100;display:none;place-items:center;padding:20px;
  background:rgba(27,35,64,.42);
}
.overlay.on{display:grid;}
.modal{
  width:min(100%,470px);max-height:84vh;overflow:auto;
  background:var(--card);border-radius:18px;padding:22px;box-shadow:var(--shadow-up);
}
.m-type{
  display:inline-block;font-size:11px;font-weight:900;color:#fff;
  background:var(--main);border-radius:99px;padding:4px 11px;margin-bottom:9px;
}
.modal h2{font-size:20px;font-weight:900;color:var(--ink);margin-bottom:8px;line-height:1.3;}
.m-desc{font-size:13px;font-weight:800;color:var(--ink-2);line-height:1.6;}
.m-desc b{color:var(--main);}
.rule-grid{display:flex;flex-direction:column;gap:7px;margin:13px 0;}
.rule{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  background:var(--sunk);font-size:12px;font-weight:800;color:var(--ink-2);line-height:1.45;
}
.rule .ri{font-size:18px;flex:0 0 22px;text-align:center;}
.btn-primary{
  background:var(--main);color:#fff;padding:13px;font-size:14px;width:100%;
}
.btn-primary:hover{background:#3F6AEB;}
.settle-duo{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:13px 0;}
.settle-person{
  padding:11px;border-radius:12px;background:var(--sunk);text-align:center;
  border-top:3px solid var(--rival);
}
.settle-person.user{border-top-color:var(--main);}
.settle-face{height:96px;margin-bottom:7px;}
.settle-face img{width:100%;height:100%;object-fit:contain;}
.settle-name{font-size:12.5px;font-weight:900;color:var(--ink);margin-bottom:4px;}
.settle-person .rc-sub{justify-content:center;}

/* ── 타이밍 게이지 ── */
.gauge-wrap{margin:15px 0;}
.gauge-track{
  position:relative;height:26px;border-radius:99px;background:var(--sunk);overflow:hidden;
}
.gz-perfect,.gz-good{position:absolute;top:0;bottom:0;}
.gz-good{background:rgba(31,155,120,.16);}
.gz-perfect{background:rgba(31,155,120,.38);z-index:1;}
.gmarker{position:absolute;top:0;bottom:0;width:3px;background:var(--ink);z-index:2;border-radius:2px;}
.gfeel{font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;margin-top:7px;}
.btn-hold{
  background:var(--main);color:#fff;padding:15px;font-size:15px;width:100%;
  user-select:none;touch-action:none;
}
.btn-hold.holding{background:var(--pos);transform:translateY(2px);}
.tverdict{font-size:15px;font-weight:900;text-align:center;margin-top:11px;min-height:20px;}


/* ── 떠오르는 수치 ── */
.floatstat{
  position:absolute;left:50%;top:38%;transform:translateX(-50%);
  font-size:14px;font-weight:900;padding:5px 11px;border-radius:99px;
  background:var(--card);box-shadow:var(--shadow);z-index:5;
  animation:floatUp 1.3s ease forwards;pointer-events:none;
}
.floatstat.up{color:var(--pos);}
.floatstat.down{color:var(--neg);}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,8px);}
  20%{opacity:1;transform:translate(-50%,0);}
  100%{opacity:0;transform:translate(-50%,-26px);}
}
.party{position:fixed;inset:0;pointer-events:none;z-index:150;}

/* ============================================================
   JS가 실제로 뿜는 클래스들 (마크업에서 역추출)
   ============================================================ */

/* ── 인라인 주사위 게이지 (홀드-릴리즈) ── */
.roll-gauge{
  position:relative;height:18px;border-radius:99px;background:var(--sunk);
  overflow:hidden;margin-bottom:7px;opacity:.55;transition:opacity .2s;
}
.roll-gauge.on{opacity:1;}
.rg-perfect,.rg-good{position:absolute;top:0;bottom:0;}
.rg-good{background:rgba(31,155,120,.16);}
.rg-perfect{background:rgba(31,155,120,.4);z-index:1;}
.rg-marker{position:absolute;top:0;bottom:0;width:3px;border-radius:2px;background:var(--ink);z-index:2;}
.roll-hint{font-size:11px;font-weight:800;color:var(--muted);text-align:center;margin-bottom:8px;}
.dice-ico{font-size:16px;}
.btn-roll.holding{background:var(--pos);transform:translateY(2px);}
.btn-roll:disabled{opacity:.55;cursor:default;}

/* ── 무대 애니메이션 ──
   전부 CSS. 로직은 건드리지 않는다. */
/* 배우가 살아 있다는 최소한의 신호: 아주 얕은 호흡 */
@keyframes heroBreathe{
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-3px) scale(1.008);}
}
/* 표정 교체: 새 얼굴이 부드럽게 들어온다 */
@keyframes faceSwap{
  0%{opacity:0;transform:scale(.94);}
  100%{opacity:1;transform:scale(1);}
}
/* 말풍선: 대사가 바뀌면 톡 튀어나온다 */
@keyframes bubblePop{
  0%{opacity:0;transform:translateY(7px) scale(.94);}
  100%{opacity:1;transform:translateY(0) scale(1);}
}
@keyframes heartBeat{
  0%,100%{transform:scale(1);}
  30%{transform:scale(1.22);}
  45%{transform:scale(1.05);}
}
/* 현재 칸: 숨 쉬듯 은은하게. 판에서 내 위치를 놓치지 않게 */
@keyframes cellGlow{
  0%,100%{box-shadow:0 0 0 3px #fff, 0 8px 20px rgba(27,35,64,.22);}
  50%{box-shadow:0 0 0 3px #fff, 0 8px 24px rgba(27,35,64,.30);}
}
/* 다음 도착 예정 칸 */
@keyframes cellNext{
  0%,100%{opacity:1;}
  50%{opacity:.55;}
}

/* ── 말 이동 / 도착 ── */
.tok.hop{animation:tokHop .24s ease;}
@keyframes tokHop{50%{transform:translateY(-7px) scale(1.15);}}
.cell.arrive{animation:cellArrive .5s ease;}
@keyframes cellArrive{
  0%{box-shadow:0 0 0 0 var(--main-line);}
  60%{box-shadow:0 0 0 7px rgba(79,124,255,0);}
  100%{box-shadow:0 0 0 0 rgba(79,124,255,0);}
}
.next-preview{font-size:11px;font-weight:800;color:var(--main);text-align:center;margin-top:5px;}

/* ── 카드 뽑기 ── */
.card-row{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0;}
.card{
  position:relative;aspect-ratio:3/4;cursor:pointer;
  perspective:700px;transition:transform .2s, opacity .25s;
}
.card:hover{transform:translateY(-5px);}
.card.dim{opacity:.28;pointer-events:none;}
.face2{
  position:absolute;inset:0;border-radius:12px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  padding:8px;text-align:center;
  backface-visibility:hidden;transition:transform .5s;
}
.face2.back{
  background:var(--main);color:#fff;font-size:26px;
  display:grid;place-items:center;
}
.face2.front{
  background:var(--card);border:1.5px solid var(--main);
  transform:rotateY(180deg);
}
.card.flip .face2.back{transform:rotateY(180deg);}
.card.flip .face2.front{transform:rotateY(360deg);}
.card.rare .face2.front{border-color:var(--warn);box-shadow:0 0 0 2px rgba(201,138,0,.2);}
.c-emoji{font-size:24px;line-height:1;}
.c-name{font-size:11px;font-weight:900;color:var(--ink);line-height:1.25;}
.c-eff{font-size:9.5px;font-weight:800;color:var(--muted);line-height:1.3;}

/* ── 진로 분기 ── */
.branch-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0;}
.prob{
  font-size:10px;font-weight:900;border-radius:99px;padding:2px 7px;
  background:var(--sunk);color:var(--muted);display:inline-block;margin-top:3px;
}
.prob.mid{background:rgba(201,138,0,.14);color:var(--warn);}

/* ── 라운드 요약 ── */
.round-card{
  background:var(--sunk);border-radius:11px;padding:11px;margin:11px 0;
  display:flex;flex-direction:column;gap:7px;
}
.round-row{
  display:flex;align-items:center;gap:8px;
  font-size:12px;font-weight:800;color:var(--ink-2);line-height:1.4;
}
.round-note{font-size:11.5px;font-weight:800;color:var(--muted);line-height:1.5;}

/* ── 정산 ── */
.settle-hero{
  display:flex;align-items:center;gap:12px;
  background:var(--sunk);border-radius:12px;padding:12px;margin:12px 0;
}
.sh-body{height:92px;flex:0 0 auto;display:flex;align-items:flex-end;}
.sh-body img{height:100%;width:auto;object-fit:contain;}
.settle-line{font-size:12.5px;font-weight:800;color:var(--ink-2);line-height:1.55;}
.settle-line b{color:var(--main);font-weight:900;}

/* ── 축하 효과 ── */
.confetti{
  position:absolute;top:-24px;font-size:17px;pointer-events:none;
  animation:confFall 1.5s ease-in forwards;
}
@keyframes confFall{
  0%{opacity:1;transform:translateY(0) rotate(0);}
  100%{opacity:0;transform:translateY(96vh) rotate(320deg);}
}

/* ── 좁은 화면: 보드를 접고 세로로 ── */
@media(max-width:1000px){
  body{overflow:auto;}
  .wrap{height:auto;min-height:100vh;}
  .play{grid-template-columns:1fr;}
  .pcol{flex-direction:row;align-items:center;gap:12px;}
  .pcol .rc-ava{width:62px;height:62px;flex:0 0 auto;}
  .pcol .rc-stats{flex:1;}
  .pcol .rc-meta{margin-top:0;flex:0 0 auto;}
  .boardring{grid-template-rows:repeat(8,minmax(40px,1fr));}
  .stage{min-height:340px;}
}
@media(max-width:560px){
  .boardring{gap:3px;}
  .cell .cell-name{display:none;}      /* 아주 좁으면 이모지만 */
  .cell .cell-ico{font-size:14px;}
  .cell.corner .cell-ico{font-size:19px;}
}
.grade-chip{cursor:help;}
.stat-tip{position:fixed;z-index:400;max-width:224px;background:#1B2340;color:#fff;font-size:11.5px;font-weight:700;line-height:1.55;padding:9px 12px;border-radius:11px;box-shadow:0 10px 28px rgba(0,0,0,.28);pointer-events:none;opacity:0;transform:translateY(5px);transition:opacity .12s,transform .12s;}
.stat-tip.on{opacity:1;transform:translateY(0);}
.stat-tip b{color:#FFD86F;font-weight:900;}
.road-toast{position:fixed;left:50%;top:64px;transform:translate(-50%,-14px);z-index:350;background:#fff;border-radius:14px;padding:11px 18px;font-size:14px;font-weight:900;color:#1B2340;box-shadow:0 12px 30px rgba(27,35,64,.22);opacity:0;transition:opacity .28s,transform .28s;border:2px solid #1F9B78;white-space:nowrap;}
.road-toast.bad{border-color:#E0476B;}
.road-toast.on{opacity:1;transform:translate(-50%,0);}
.road-toast .rt-ico{font-size:18px;margin-right:4px;}
/* 🎒 가방 버튼 + 인벤토리 */
.bag-btn{position:fixed;right:18px;bottom:18px;z-index:360;width:56px;height:56px;border:0;border-radius:50%;
  background:#fff;box-shadow:0 8px 22px rgba(27,35,64,.22);font-size:26px;cursor:pointer;line-height:1;
  display:grid;place-items:center;transition:transform .15s;}
.bag-btn:hover{transform:translateY(-3px);}
.bag-btn.has{box-shadow:0 0 0 3px var(--warn),0 8px 22px rgba(27,35,64,.22);}
.bag-badge{position:absolute;top:-3px;right:-3px;min-width:20px;height:20px;border-radius:99px;background:var(--neg);
  color:#fff;font-size:11px;font-weight:900;display:grid;place-items:center;padding:0 5px;}
.bag-list{display:flex;flex-direction:column;gap:9px;margin:8px 0 4px;max-height:52vh;overflow-y:auto;}
.bag-item{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:11px;background:var(--sunk);
  border-radius:13px;padding:10px 12px;text-align:left;}
.bag-item.rare{background:linear-gradient(120deg,#FFF6E0,#FFE9F2);box-shadow:inset 0 0 0 2px var(--warn);}
.bi-emoji{font-size:28px;text-align:center;}
.bi-info b{font-size:13.5px;font-weight:900;color:var(--ink);}
.bi-info small{display:block;font-size:11px;font-weight:700;color:var(--muted);line-height:1.4;margin-top:2px;}
.bi-use{padding:8px 15px;font-size:13px;background:var(--pos);}
.bag-empty{text-align:center;color:var(--muted);font-weight:800;font-size:13px;line-height:1.7;padding:22px 0;}
</style>

<div class="overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>

    <button class="btn btn-hold" id="holdBtn">🎯 꾹 누르기</button>
    <div class="tverdict" id="tVerdict"></div>

function getStageAvatar(p, stage){
  if(stage==="youth"||stage==="adult"||stage==="senior"){
    const c=getChar(p);
    if(c && c.adultBaseImage) return { image:c.adultBaseImage, fallback:c.adultBaseFallback||(p.gender==="female"?"👩":"👨") };
    return { image:(p.gender==="female"?"./image/user/female/1/adult.png":"./image/user/male/1/adult.png"), fallback:(p.gender==="female"?"👩":"👨") };
  }
  if(stage==="high"){
    const c=getChar(p);
    if(c && c.highBaseImage) return { image:c.highBaseImage, fallback:c.highBaseFallback||(p.gender==="female"?"👩‍🎓":"👨‍🎓") };
    return { image:(p.gender==="female"?"./image/user/female/1/high.png":"./image/user/male/1/high.png"), fallback:(p.gender==="female"?"👩‍🎓":"👨‍🎓") };
  }
  const table = STAGE_AVATARS[stage] || STAGE_AVATARS.child;
  return table[p.gender] || table.male || CHILD_BASE.male;
}

  let best=null, bs=-1e9;
  pool.forEach(j=>{ const s=fit(j)*0.6 + (j.tier===tier?18:0) + (j.entry?6:0) + Math.random()*14; if(s>bs){ bs=s; best=j; } });
  return best;
}

/* ---------- 공통 유틸 ---------- */
function rnd(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function pick(arr){ return arr[rnd(0,arr.length-1)]; }
function clampStat(v){ return Math.max(0,Math.min(100,v)); }
function clampMoney(v){ return Math.max(-9999,Math.min(99999,v)); }

/* 이미지 fallback 헬퍼: 경로 + 이모티콘 */
function imgTag(src, fb, style){
  const st = style? ` style="${style}"` : "";
  return `<img src="${src}" alt=""${st} onerror="this.replaceWith(document.createTextNode('${fb}'))">`;
}

/* 돈 라벨 변환: 시대에 따라 표현이 달라짐 (유년기~고교는 '소지금/용돈') */
function moneyLabel(stageKey){
  const early = ["child","elementary","middle","high"];
  return early.includes(stageKey) ? "소지금" : "자산";
}
function showMoneyPanel(stageKey){

  return !["child","elementary","middle"].includes(stageKey);
}

/* 능력치 적용 (delta 객체) → 적용된 변화 반환 */
function applyStat(p, eff){
  const applied={};
  // 캐릭터 패시브를 여기서 실제로 적용한다 (설명만 있고 안 먹던 것들)
  var _ch=(typeof getChar==="function")?getChar(p):null; var ps=(_ch&&_ch.passive)||{};
  for(const k in eff){
    var v=eff[k];
    if(k==="money"){
      if(v>=50 && ps.winBonus) v+=ps.winBonus;                 // 대박 보상 증가
      if(v<=-50 && ps.loseExtra) v-=ps.loseExtra;              // 큰 손실 가중
      if(v<0 && ps.crisisReduce) v=Math.round(v*(1-ps.crisisReduce)); // 위기 피해 감소
      const b=p.money||0; p.money=clampMoney(b+v); applied.money=p.money-b;
    } else {
      if(k==="health" && v>0 && ps.healHeal) v=Math.round(v*ps.healHeal);   // 회복 강화
      if(v<0 && ps.crisisReduce) v=Math.round(v*(1-ps.crisisReduce));
      const b=p.stats[k]; p.stats[k]=clampStat(b+v); applied[k]=p.stats[k]-b;
    }
  }
  return applied;
}

/* ---------- 타이밍 입력 (공통) ---------- */
const TVERDICT = {
  perfect:{bonus:0.15,label:"완벽!",color:"#1f9b78",feel:"기적이 일어날 것 같다 ✨"},
  good:   {bonus:0.08,label:"좋음!",color:"#8FD43A",feel:"감이 좋다 👍"},
  ok:     {bonus:0.0, label:"애매", color:"#c98a00",feel:"그럭저럭… 🤔"},
  miss:   {bonus:-0.10,label:"삐끗!",color:"#e0476b",feel:"조금 불안하다 😣"}
};
function runTiming(opts, cb){
  opts=opts||{};
  const ov=document.getElementById("timingOverlay");
  const marker=document.getElementById("gMarker"), pz=document.getElementById("gzPerfect"), gz=document.getElementById("gzGood");
  const feel=document.getElementById("gFeel"), verd=document.getElementById("tVerdict"), hold=document.getElementById("holdBtn");
  document.getElementById("tmType").textContent=(opts.icon||"🎯")+" "+(opts.kind||"타이밍");
  document.getElementById("tmType").style.background=opts.accent||"var(--coral)";
  document.getElementById("tmTitle").textContent=opts.title||"타이밍을 잡아라!";
  document.getElementById("tmDesc").innerHTML=opts.desc||"버튼을 꾹 눌렀다가 <b>좋은 순간</b>에 손을 떼세요.";
  verd.textContent=""; feel.textContent="대기 중…"; hold.textContent=opts.holdLabel||"🎯 꾹 누르기"; hold.style.display="";
  const pc=rnd(38,62), pHalf=7, gHalf=17;
  pz.style.left=(pc-pHalf)+"%"; pz.style.width=(pHalf*2)+"%";
  gz.style.left=(pc-gHalf)+"%"; gz.style.width=(gHalf*2)+"%";
  ov.classList.add("on");
  let pos=0,dir=1,anim=null,holding=false,settled=false;
  const speed=opts.speed||2.2;
  function stepFn(){ pos+=dir*speed; if(pos>=100){pos=100;dir=-1;} if(pos<=0){pos=0;dir=1;}
    marker.style.left=pos+"%"; const d=Math.abs(pos-pc);
    feel.textContent=d<=pHalf?"지금이야! 🔥":d<=gHalf?"거의 다 왔다…":"타이밍을 노려라"; anim=requestAnimationFrame(stepFn); }
  function judge(){ if(settled)return; settled=true; cancelAnimationFrame(anim); hold.classList.remove("holding");
    const d=Math.abs(pos-pc); let key=d<=pHalf?"perfect":d<=gHalf?"good":(d<=gHalf+18?"ok":"miss");
    const v=TVERDICT[key]; verd.textContent=v.label; verd.style.color=v.color; feel.textContent=v.feel; hold.style.display="none";
    cleanup(); setTimeout(()=>{ ov.classList.remove("on"); cb({key,bonus:v.bonus,label:v.label}); },700); }
  function down(e){ if(holding||settled)return; e.preventDefault(); holding=true; hold.classList.add("holding"); pos=0;dir=1; stepFn(); }
  function up(e){ if(!holding||settled)return; e.preventDefault(); holding=false; judge(); }
  function cleanup(){ hold.removeEventListener("mousedown",down); hold.removeEventListener("mouseup",up); hold.removeEventListener("mouseleave",up);
    hold.removeEventListener("touchstart",down); hold.removeEventListener("touchend",up); }
  if(opts.auto){
    hold.style.display="none"; feel.textContent="타이밍을 재는 중…"; stepFn();
    const skill=opts.aiSkill!==undefined?opts.aiSkill:0.5;
    setTimeout(()=>{ const r=Math.random(); let t; if(r<skill*0.4)t="perfect"; else if(r<skill*0.4+0.35)t="good"; else if(r<skill*0.4+0.65)t="ok"; else t="miss";
      if(t==="perfect")pos=pc+rnd(-pHalf,pHalf); else if(t==="good")pos=pc+(Math.random()<.5?-1:1)*rnd(pHalf+1,gHalf);
      else if(t==="ok")pos=pc+(Math.random()<.5?-1:1)*rnd(gHalf+1,gHalf+18); else pos=pc+(Math.random()<.5?-1:1)*rnd(gHalf+19,gHalf+34);
      pos=Math.max(0,Math.min(100,pos)); marker.style.left=pos+"%"; judge(); }, rnd(700,1400));
    return;
  }
  hold.addEventListener("mousedown",down); hold.addEventListener("mouseup",up); hold.addEventListener("mouseleave",up);
  hold.addEventListener("touchstart",down,{passive:false}); hold.addEventListener("touchend",up,{passive:false});
}
function aiTimingSkill(p){ const b={stable:0.5,challenger:0.62,romantic:0.5,tycoon:0.6,grinder:0.66,artist:0.55,idol:0.58}[p.aiTrait]||0.5;
  return Math.max(0.3,Math.min(0.85, b+((p.stats.luck||50)-50)/200)); }

/* ---------- 카드뽑기 (공통) ---------- */
/* pool: 후보 카드 배열, count: 표시 장수, onResult(card) 콜백 */
function drawCards(pool, count, onResult){
  const modal=document.getElementById("modal");
  const choices=[]; const used=new Set();
  while(choices.length<count && choices.length<pool.length){ const c=pick(pool); if(!used.has(c.id)){ used.add(c.id); choices.push(c);} }
  const cardsHTML = choices.map((c,i)=>`
    <div class="card ${c.rarity==='rare'?'rare':''}" id="card${i}" onclick="window._flipCard(${i})">
      <div class="face2 back">🎴<small>탭하여 뽑기</small></div>
      <div class="face2 front">
        <div class="c-emoji">${c.emoji}</div>
        <div class="c-name">${c.name}</div>
        <div class="c-eff">${c.desc}</div>
      </div>
    </div>`).join("");
  modal.innerHTML = `
    <span class="m-type" style="background:linear-gradient(90deg,var(--purple),var(--blue))">🎴 카드뽑기</span>
    <h2>마음이 끌리는 카드를 골라보세요</h2>
    <p class="m-desc">카드 한 장이 아이의 재능과 성격을 바꿉니다.</p>
    <div class="card-row">${cardsHTML}</div>
    <div id="cardResult"></div>`;
  document.getElementById("modalOverlay").classList.add("on");
  let picked=false;
  window._flipCard=(i)=>{
    if(picked) return; picked=true;
    const card=choices[i];
    document.querySelectorAll(".card").forEach((el,idx)=>{ if(idx!==i) el.classList.add("dim"); });
    document.getElementById("card"+i).classList.add("flip");
    setTimeout(()=>{
      const res=document.getElementById("cardResult");
      res.innerHTML = `<p class="m-desc" style="margin-top:6px"><b>${card.emoji} ${card.name}</b> 카드를 얻었다!<br>${card.desc}</p>
        <button class="btn btn-primary" onclick="window._closeCard()">계속하기</button>`;
      if(card.rarity==="rare") celebrate(["✨","🎴","⭐","💫"]);
    }, 650);
  };
  window._closeCard=()=>{
    document.getElementById("modalOverlay").classList.remove("on");
    const chosen = choices.find((c,i)=>document.getElementById("card"+i)?.classList.contains("flip")) || choices[0];
    onResult(chosen);
  };
}

/* 카드 효과 적용 (두 플레이어 공통) */

  p.cardHistory = p.cardHistory||[];
  p.cardHistory.push({id:card.id, name:card.name, stage:GS.currentStage});
  return applied;
}

const TALENT_SIDE = [0, 10, 25, 55];   // 청년기 부수입 (성인기에 더 커진다)

function talentScore(p, key){
  const cat=TALENT_CATEGORIES[key]; const f=p.eventFlags||{};
  return cat.flags.filter(x=>f[x]).length / cat.flags.length;
}
function talentLevel(p, key){
  // ★3은 한 우물을 깊게 판 사람만 (시뮬레이션에서 라이벌 8판 전원이 ★3이던 문제)
  const s=talentScore(p,key), c=TALENT_CATEGORIES[key].flags.filter(x=>(p.eventFlags||{})[x]).length;
  // 특화 vs 범용: 다른 재능도 60% 넘게 키운 범용형은 ★2가 상한 (설계서 §2 엔진 A의 대가)
  const spread=Object.keys(TALENT_CATEGORIES).some(o=>o!==key && talentScore(p,o)>=0.6);
  if(s>=0.75 && c>=3 && !spread) return 3;
  if(s>=0.4 && c>=2) return 2;
  if(c>=1) return 1;
  return 0;
}
function topTalent(p){
  let best=null, bv=0;
  for(const k in TALENT_CATEGORIES){ const s=talentScore(p,k); if(s>bv){ bv=s; best=k; } }
  return best;
}
function talentSideIncome(p){
  const k=topTalent(p); if(!k) return 0;
  let v=TALENT_SIDE[talentLevel(p,k)];
  if(p.youthTrack==="talent") v=Math.round(v*1.6);   // 재능 트랙이면 부수입 강화
  if(p.talentDemoted) v=Math.round(v*0.5);           // 갈등에서 꿈을 택하면 재능은 취미로
  return v;
}

  const k=topTalent(p); if(!k) return "아직 뚜렷한 재능은 없어요";
  const c=TALENT_CATEGORIES[k], lv=talentLevel(p,k);
  return `${c.emoji} ${c.name} ${TALENT_STAR[lv]}`;
}

function jobFitScore(p, job){
  const s=p.stats; let sc=0;
  job.req.forEach(k=>{ sc += (k==="money") ? Math.min(100,(p.money||0)/2) : (s[k]||0); });
  sc = sc/job.req.length;
  const t=topTalent(p);
  if(t && TALENT_CATEGORIES[t].jobs.includes(job.name)) sc += 9*talentLevel(p,t);
  if(p.highRoute==="study"  && ["pro","public","corp"].includes(job.tier)) sc += 6;
  if(p.highRoute==="talent" && job.tier==="art") sc += 8;
  if(p.highRoute==="partTime" && job.tier==="stable") sc += 5;
  // 고교 진학 결과(education id)가 취업에 이어진다 — 예전엔 "명문대"/"4년제" 문자열을 찾느라 한 번도 적용되지 않았다
  sc += ({elite:9, metro:6, local:4, college:3, art:(job.tier==="art"?8:0), retry:1, work:(job.tier==="stable"?4:0)})[p.education]||0;
  const ch=getChar(p);
  if(ch && ch.passive && ch.passive.goodTier && ch.passive.goodTier.includes(job.tier)) sc += 6;
  return sc;
}
function jobChance(p, job){
  const fit=jobFitScore(p,job);
  let pr = 0.14 + (fit-45)*0.011 - (job.difficulty-0.5)*0.5;
  var _jc=(typeof getChar==="function")?getChar(p):null;
  if(_jc&&_jc.passive&&_jc.passive.jobBonus) pr += _jc.passive.jobBonus;

/* ── 상대 성향별 선택 가중치 (무작위 클릭 대신) ── */
const TRAIT_WEIGHT = {
  stable:     { intelligence:1.2, health:1.4, relationship:1.0, charm:0.8, money:1.1, aff:0.9 },
  challenger: { intelligence:1.0, health:0.8, relationship:0.9, charm:1.2, money:1.5, aff:0.9 },
  romantic:   { intelligence:0.8, health:1.0, relationship:1.6, charm:1.5, money:0.7, aff:2.0 },
  tycoon:     { intelligence:1.3, health:0.7, relationship:0.8, charm:0.9, money:2.0, aff:0.5 },
  grinder:    { intelligence:1.6, health:0.9, relationship:0.7, charm:0.8, money:1.2, aff:0.6 }
};
function aiChoiceIndex(p, choices){
  const w = TRAIT_WEIGHT[p.aiTrait] || TRAIT_WEIGHT.stable;
  const scored = choices.map((c,i)=>{
    let s=0;
    for(const k in (c.eff||{})) s += (c.eff[k]||0) * (w[k]||1) * (k==="money"?0.12:1);
    if(c.aff) s += c.aff * (w.aff||1);
    if(c.career) s += c.career * 6;
    return {i:i, s:s + rnd(-2,2)};
  }).sort((a,b)=>b.s-a.s);
  // 20%는 2순위 — 완전히 읽히지 않도록
  return (scored.length>1 && Math.random()<0.2) ? scored[1].i : scored[0].i;
}

function ensureYouthFields(p){
  const d={ youthPos:0, youthTrack:null, job:null, jobName:null, careerLevel:0,
    youthIncomeTotal:0, youthCards:[], youthEventLog:[], burnoutLevel:0,
    marriedAt:null, proposeTried:false, conflictSeen:false, talentDemoted:false,
    twoTimingCaught:0, youthSummaryLine:null };
  for(const k in d){ if(p[k]===undefined) p[k]=d[k]; }
  if(typeof p.money!=="number") p.money=0;
  if(!p.affinity) p.affinity={};
  if(!p.eventFlags) p.eventFlags={};
  // 고교에서 이어진 호감도를 affinity 맵으로 승계
  // (예전엔 affinity에 중학교 첫사랑 0점이 먼저 들어 있으면 승계가 통째로 건너뛰어져,
  //  고교에서 고백에 성공해도 청년기를 호감 0에서 시작했다 — 시뮬레이션 사용자 결혼 0%의 원인)
  const hid=p.currentPartnerId||p.middleCrushNpcId||p.currentCrushId;
  if(hid && !p.highAffCarried){
    p.highAffCarried=true;
    const carry=Math.min(80, Math.max(10, 40 + (p.highAffinity||0)*2) + (p.confessionResult==="성공"||p.hasPartner?10:0));
    p.affinity[hid]=Math.max(p.affinity[hid]||0, carry);
  }
}
function ensureCrush(p){
  if(p.currentPartnerId) return;
  if(p.middleCrushNpcId){ p.currentPartnerId=p.middleCrushNpcId; return; }
  if(p.currentCrushId){ p.currentPartnerId=p.currentCrushId; return; }
  const want = p.gender==="female" ? "male" : "female";
  const pool = LOVE_NPCS.filter(n=>n.gender===want);
  p.currentPartnerId = (pool.length? pick(pool):pick(LOVE_NPCS)).id;
}

/* 선택 결과 → 표정. 무엇을 얻고 무엇을 잃었는지가 얼굴에 드러난다. */
function moodFromApplied(applied, fallback){
  if(!applied) return fallback||"normal";
  let up=0, down=0, healthHit=0;
  for(const k in applied){
    const v=applied[k]; if(!v) continue;
    if(v>0) up+=v; else { down+=-v; if(k==="health") healthHit+=-v; }
  }
  if(healthHit>=4 && up<=down) return "burnout";
  if(down===0 && up>0) return "happy";
  if(up===0 && down>0) return "sad";
  if(down>up) return "worried";
  if(up>0) return "happy";
  return fallback||"normal";
}

function renderTimeline(){
  document.getElementById("timeline").innerHTML = LIFE_TIMELINE.map(t=>{
    const done = LIFE_TIMELINE.findIndex(x=>x.key===STAGE_KEY) > LIFE_TIMELINE.findIndex(x=>x.key===t.key);
    const now = t.key===STAGE_KEY;
    return `<span class="tl ${now?"now":done?"done":""}">${t.ico}<b>${t.name}</b></span>`;
  }).join("");
}
function renderBoard(){
  const el=document.getElementById("miniboard"); el.innerHTML="";
  const tmap={}; players.forEach(p=>{ if(typeof p._moveTarget==="number") tmap[p._moveTarget]=p._lastSteps||""; });
  YOUTH_BOARD.forEach((c,i)=>{
    const cell=document.createElement("div");
    cell.className=`cell ${cellClass(i)}${tmap[i]?" next":""}`; cell.id=`cell${i}`;
    cell.innerHTML=`<span class="cn">${i+1}</span><span class="cell-ico">${c.ico}</span><span class="cell-name">${c.name}</span>${tmap[i]?`<span class="step-badge">+${tmap[i]}칸</span>`:""}`;
    el.appendChild(cell);
  });
  placeToken(userP(),"user"); placeToken(aiP(),"ai"); highlightCells();
}
function placeToken(p,kind){
  kind=kind||(p.type==="user"?"user":"ai");
  const old=document.getElementById(`tok_${p.id}`); if(old) old.remove();   // 말은 언제나 한 개
  const cell=document.getElementById(`cell${p.childPos}`); if(!cell) return;
  const t=document.createElement("div"); t.className=`tok ${kind}`; t.id=`tok_${p.id}`;
  t.innerHTML=kind==="user"?"🙂":"🌸"; cell.appendChild(t);
}
function highlightCells(){
  document.querySelectorAll(".cell.cur").forEach(c=>c.classList.remove("cur"));
  const c=document.getElementById(`cell${curP().childPos}`); if(c) c.classList.add("cur");
}
function trackFeel(p){
  const m={corp:"월급을 받는 삶",exam:"시험을 준비하는 삶",talent:"재능을 파는 삶",venture:"판을 벌이는 삶"};
  return p.youthTrack? m[p.youthTrack] : "아직 길을 정하지 않았어요";
}
function moneyFeel(p){
  const m=p.money||0;
  if(m<0) return `빚이 있어요 (${m})`;
  if(m<100) return `자산 ${m}`;
  if(m<400) return `자산 ${m}`;
  return `자산 넉넉 (${m})`;
}
function jobFeel(p){ return p.job ? `${p.job.emoji} ${p.job.name}` : "아직 무직이에요"; }
function marryFeel(p){
  if(p.isMarried) return `💍 ${p.spouseName}와 결혼`;
  const c=marriageCandidates(p);
  return c.length? "청혼할 수 있는 사람이 있어요" : "아직 결혼 이야기는 일러요";
}
function rivalCol(p){
  const sm=(k)=>statChip(null,k,p);
  const m=p.money||0;
  return `<div class="rc-ava">${avaImg(p)}</div>
    <div class="rc-name"><i class="rc-dot"></i>${p.name}</div>
    <div class="rc-stats">${sm('intelligence')}${sm('charm')}${sm('health')}${sm('relationship')}${sm('luck')}</div>
    <div class="rc-meta">
      <span class="rc-sub" title="현재 위치">📍 <b>${p.childPos+1}</b>/28</span>
      ${p.job?`<span class="rc-sub" title="${jobFeel(p)}">${p.job.emoji} ${p.job.name}</span>`:`<span class="rc-sub" title="${trackFeel(p)}">🛣️ ${p.youthTrack?trackFeel(p):"진로 미정"}</span>`}
      <span class="rc-sub" title="${moneyFeel(p)}">👛 <b>${m}</b></span>
      ${p.isMarried?`<span class="rc-sub" title="${marryFeel(p)}">💍 ${p.spouseName||"결혼"}</span>`:""}
    </div>`;
}
function renderRival(){
  const uc=document.getElementById("userCol"), ac=document.getElementById("aiCol");
  uc.className="pcol is-user "+((curP().id===userP().id)?"turn":"");
  ac.className="pcol is-ai "+((curP().id===aiP().id)?"turn":"");
  uc.innerHTML=rivalCol(userP()); ac.innerHTML=rivalCol(aiP());
  renderBag();
}
function setMid(t,m,f){
  document.getElementById("rmidTurn").innerHTML=t;
  document.getElementById("rmidMove").innerHTML=m;
  document.getElementById("rmidFeel").innerHTML=f||"";
}
function log(html,kind){
  const el=document.getElementById("log");
  const it=document.createElement("div"); it.className="logitem "+(kind||""); it.innerHTML=html;
  el.insertBefore(it,el.firstChild);
  while(el.children.length>30) el.removeChild(el.lastChild);
}
function showSceneMsg(hero, chip, say, sub){
  const sc=document.getElementById("scene"); sc.style.display="";
  const cell=YOUTH_BOARD[curP().childPos]||{};
  setSituation(cell.type, cell.ico);
  document.getElementById("sceneChip").textContent=chip;
  document.getElementById("heroBody").innerHTML=hero;
  document.getElementById("sceneSay").innerHTML=say;
  document.getElementById("sceneSub").innerHTML=sub||"";
  popBubble();
}
function choiceCardsHTML(choices,opts){
  opts=opts||{};
  return `<div class="act-grid">${choices.map((c,i)=>{
    const cls=["btn","act-btn"];
    if(opts.ai)cls.push("ai-thinking");
    if(opts.picked===i)cls.push("ai-picked"); else if(opts.picked!==undefined)cls.push("ai-dim");
    const click=opts.ai?"":` onclick="${opts.handler||'chooseScene'}(${i})"`;
    return `<button class="${cls.join(" ")}"${click}><span class="ai">${c.ai}</span>${c.text}</button>`;
  }).join("")}</div>`;
}
function deltaStr(applied,money){
  const lm={intelligence:"지능",charm:"매력",health:"건강",relationship:"인간관계",luck:"운"};
  const parts=[];
  for(const k in applied){ if(k==="money") continue; if(applied[k])parts.push(`${lm[k]}${applied[k]>0?'+':''}${applied[k]}`); }
  if(money)parts.push(`자산${money>0?'+':''}${money}`);
  return parts.length?`(${parts.join(", ")})`:"";
}

/* ── 인트로: 재능 공개 + 진로 선택 ── */
function showTransition(){
  const u=userP();
  const k=topTalent(u), lv=k?talentLevel(u,k):0;
  const talentBox = k
    ? `<div class="rule"><span class="ri">${TALENT_CATEGORIES[k].emoji}</span><span>어린 시절 쌓아온 <b>${TALENT_CATEGORIES[k].name}</b> — ${talentFeel(lv)} ${TALENT_STAR[lv]}<br><small>이 시대부터 재능은 돈이 됩니다.</small></span></div>`
    : `<div class="rule"><span class="ri">🌫️</span><span>뚜렷하게 쌓아온 재능은 없어요.<br><small>대신 어떤 길이든 편견 없이 갈 수 있어요.</small></span></div>`;
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:var(--purple)">🏫 → 🎓 성인</span>
    <h2>스무 살이 되었어요</h2>
    <p class="m-desc">교복을 벗었어요. 이제부터는 <b>버는 것</b>과 <b>사는 것</b>이 함께 굴러갑니다.</p>
    <div class="rule-grid">${talentBox}</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="closeTransition()">길을 정하러 가기 →</button>`;
  document.getElementById("modalOverlay").classList.add("on");
}
function closeTransition(){
  document.getElementById("modalOverlay").classList.remove("on");
  trackChoice();
}

/* ── 진로 선택 (꿈) ── */
function trackChoice(){
  const u=userP();
  showSceneMsg(`<div class="hero-ava">${avaImg(u)}</div>`,"진로","어떤 길로 갈까요?","한 번 정하면 이 시대 내내 따라옵니다");
  setMid("🧭 갈림길","인생의 방향을<br>정하는 순간","");
  document.getElementById("actionPanel").innerHTML=
    `<div class="ap-label">어떤 어른이 되고 싶나요?</div>${choiceCardsHTML(TRACKS,{handler:"chooseTrack"})}`;
}
function chooseTrack(i){
  if(busy) return; busy=true;
  const u=userP(), t=TRACKS[i];
  u.youthTrack=t.key; u.desiredJob=t.key;
  // 상대도 성향대로 트랙 선택
  const a=aiP();
  const aiPrefer={stable:"exam",challenger:"venture",romantic:"corp",tycoon:"venture",grinder:"corp"};
  a.youthTrack=aiPrefer[a.aiTrait]||"corp"; a.desiredJob=a.youthTrack;
  log(`🧭 <b>${u.name}</b>${jo(u.name,'은는')} 「${t.text}」을 택했어요`);
  log(`🧭 <b>${a.name}</b>${jo(a.name,'은는')} 「${(TRACKS.find(x=>x.key===a.youthTrack)||TRACKS[0]).text}」을 택했어요`);
  busy=false;
  // 재능과 어긋나면 갈등 이벤트
  const k=topTalent(u);
  const mismatch = k && talentLevel(u,k)>=2 && !TRACKS.find(x=>x.key===t.key).tiers.some(tier=>
    JOBS.filter(j=>j.tier===tier).some(j=>TALENT_CATEGORIES[k].jobs.includes(j.name)));
  if(mismatch && !u.conflictSeen){ conflictEvent(u,k); return; }
  jobHunt(u);
}

/* ── 갈등 이벤트: 꿈 vs 재능 ── */
function conflictEvent(p, k){
  p.conflictSeen=true;
  const c=TALENT_CATEGORIES[k];
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:var(--coral)">⚡ 갈등</span>
    <h2>"${c.name}${jo(c.name,'은는')} 어쩌고?"</h2>
    <p class="m-desc">부모님이 물었어요. 어릴 때부터 쌓아온 <b>${c.emoji} ${c.name}</b>${jo(c.name,'을를')} 두고,<br>지금 다른 길을 고르려 하고 있어요.</p>
    <div class="act-grid">
      <button class="btn act-btn" onclick="resolveConflict(0)"><span class="ai">🎯</span>고른 길을 간다</button>
      <button class="btn act-btn" onclick="resolveConflict(1)"><span class="ai">${c.emoji}</span>재능을 따라간다</button>
      <button class="btn act-btn" onclick="resolveConflict(2)"><span class="ai">🔥</span>둘 다 해본다</button>
    </div>`;
  document.getElementById("modalOverlay").classList.add("on");
}
function resolveConflict(i){
  const u=userP(); const k=topTalent(u); const c=TALENT_CATEGORIES[k];
  document.getElementById("modalOverlay").classList.remove("on");
  if(i===0){
    u.talentDemoted=true;
    log(`⚡ 꿈을 택했어요. <b>${c.name}</b>${jo(c.name,'은는')} 취미가 되었어요 <small>(부수입 절반)</small>`);
  }else if(i===1){
    u.youthTrack="talent"; u.desiredJob="talent";
    log(`⚡ 재능을 택했어요. <b>${c.name}</b>의 길로 방향을 틀었어요`);
  }else{
    u.talentDemoted=true;
    const ap=applyStat(u,{health:-10});
    log(`⚡ 둘 다 붙잡았어요 ${deltaStr(ap)} <small>(재능 부수입 절반, 체력 소모)</small>`);
  }
  jobHunt(u);
}

/* ── 취업 ── */
/* 성인이 되면 직업이 요구하는 능력치를 살짝 보여준다(등급으로). 학창시절 연애처럼 완전 비공개는 아니다. */
function jobReqHint(job){
  const u=userP(); const lm={intelligence:"지능",charm:"매력",health:"건강",relationship:"인간관계",luck:"운",money:"자산"};
  return (job.req||[]).map(function(k){ return lm[k]+(k==="money"?"":" "+statGrade((u.stats&&u.stats[k])||0)); }).join(" · ");
}
function jobHunt(p){
  const pool=jobsForTrack(p.youthTrack);
  const picks=pool.slice(0,3);
  if(!picks.length){ startYouth(); return; }
  const choices=picks.map(j=>({ text:`${j.name}에 지원<br><small style="opacity:.72;font-weight:600">필요 능력치 ${jobReqHint(j)}</small>`, ai:j.emoji, job:j }));
  showSceneMsg(`<div class="hero-ava">${avaImg(p)}</div>`,"취업","어디에 지원할까요?","합격은 아무도 장담할 수 없어요");
  setMid("💼 지원","이력서를<br>어디에 낼까요?","");
  document.getElementById("actionPanel").innerHTML=
    `<div class="ap-label">${trackFeel(p)}</div>${choiceCardsHTML(choices,{handler:"applyJob"})}`;
  window._jobChoices=choices;
}
function applyJob(i){
  if(busy) return; busy=true;
  const u=userP(); const job=window._jobChoices[i].job;
  const pr=jobChance(u,job);
  runTiming({kind:"면접", icon:"💼", title:"면접의 순간", desc:"준비한 만큼, 그리고 <b>타이밍</b>만큼.", accent:"var(--blue)"}, function(v){
    const ok = Math.random() < Math.max(0.05, Math.min(0.95, pr + v.bonus));
    if(ok){ setJob(u, job); log(`💼 <b>${u.name}</b> — ${job.emoji} ${job.name} 합격! <small>${v.label}</small>`); }
    else{
      // 불합격이 곧 무직은 아니다. 눈을 낮춰 자리를 잡는다 —
      // 그래야 "취업 트랙"이 함정이 아니라 선택지가 된다.
      const fb=fallbackJob(u, job);
      log(`💼 <b>${u.name}</b> — ${job.name} 불합격… <small>${v.label}</small>`);
      applyStat(u,{charm:-3, health:-3});
      if(fb){ setJob(u, fb); u.jobFallback=true; log(`💼 <b>${u.name}</b> — 눈을 낮춰 ${fb.emoji} ${fb.name}${jo(fb.name,"으로")} 시작해요`); }
    }
    aiJobHunt(aiP(), job);
    renderRival();
    busy=false;
    // 같은 회사, 남은 자리는 하나 (설계서 §5 라이벌 접점)
    if(!sameCompanyDuel(u, aiP())) setTimeout(startYouth, 700);
  });
}
function setJob(p, job){
  p.job={name:job.name, emoji:job.emoji, tier:job.tier, baseSalary:job.baseSalary, freelance:!!job.freelance, venture:!!job.venture};
  p.jobName=job.name; p.jobTier=job.tier; p.salary=job.baseSalary;
  p.careerHistory=p.careerHistory||[]; p.careerHistory.push({stage:"youth", job:job.name});
}
function aiJobHunt(a, rivalJob){
  const pool=jobsForTrack(a.youthTrack); if(!pool.length) return;
  let job=pool[rnd(0,Math.min(2,pool.length-1))];
  // 같은 길을 가는 라이벌은 절반 확률로 내가 지원한 회사에 원서를 낸다
  if(rivalJob && pool.some(j=>j.name===rivalJob.name) && Math.random()<0.5) job=rivalJob;
  if(Math.random() < jobChance(a,job)+0.1){ setJob(a,job); log(`💼 <b>${a.name}</b> — ${job.emoji} ${job.name} 합격`); }
  else{
    const fb=fallbackJob(a, job);
    if(fb){ setJob(a,fb); a.jobFallback=true; log(`💼 <b>${a.name}</b> — 눈을 낮춰 ${fb.emoji} ${fb.name}${jo(fb.name,"으로")} 시작해요`); }
    else log(`💼 <b>${a.name}</b> — 아직 취업 준비 중이에요`);
  }
}

/* 둘 다 같은 회사에 붙었다면 한 명만 남는다 — 적합도 + 운으로 가린다 */
function sameCompanyDuel(u, a){
  if(!u.job || !a.job || u.job.name!==a.job.name || u.jobFallback || a.jobFallback) return false;
  const jobDef=JOBS.find(j=>j.name===u.job.name); if(!jobDef) return false;
  const us=jobFitScore(u,jobDef)+u.stats.luck*0.1+rnd(-6,6), as=jobFitScore(a,jobDef)+a.stats.luck*0.1+rnd(-6,6);
  const iWin=us>=as, loser=iWin?a:u;
  const fb=fallbackJob(loser, jobDef);
  if(fb){ setJob(loser, fb); loser.jobFallback=true; }
  log(`🏢 <b>${jobDef.name}</b> 최종 한 자리 — <b>${(iWin?u:a).name}</b> 합격, ${loser.name}${jo(loser.name,"은는")} ${fb?fb.name+jo(fb.name,"으로"):"다른 길로"}`, iWin?"good":"a");
  if(iWin) celebrate(["💼","🎉","✨"]);
  renderRival(); savePlayers();
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:linear-gradient(90deg,var(--blue),var(--purple))">🏢 최종 면접</span>
    <h2>같은 회사, 남은 자리는 하나</h2>
    <p class="m-desc"><b>${a.name}</b>도 <b>${jobDef.emoji} ${jobDef.name}</b>에 지원했어요. 최종 면접에서 둘 중 한 명만 남아요.</p>
    <div class="settle-duo">
      <div class="settle-person user"><div class="settle-face">${avaImg(u)}</div><div class="settle-name">🙂 ${u.name}</div><div class="settle-line"><b>${iWin?"최종 합격 🎉":"아쉽게 탈락"}</b></div></div>
      <div class="settle-person ai"><div class="settle-face">${avaImg(a)}</div><div class="settle-name">🌸 ${a.name}</div><div class="settle-line"><b>${iWin?"아쉽게 탈락":"최종 합격"}</b></div></div>
    </div>
    <p class="m-desc">${iWin?`${a.name}${jo(a.name,"은는")} 눈을 낮춰 ${fb.emoji} ${fb.name}${jo(fb.name,"으로")} 시작해요.`:`눈을 낮춰 ${fb.emoji} ${fb.name}${jo(fb.name,"으로")} 시작해요. 이직은 성인기에 다시 노려봐요.`}</p>
    <button class="btn btn-primary" style="margin-top:12px" onclick="document.getElementById('modalOverlay').classList.remove('on');startYouth()">계속 →</button>`;
  document.getElementById("modalOverlay").classList.add("on");
  return true;
}

/* ── 턴 ── */
function startYouth(){
  document.getElementById("scene").style.display="none";
  round=1; turnIdx=0; busy=false;
  savePlayers(); saveGameState();
  beginTurn();
}
function beginTurn(){
  if(round>TOTAL_ROUNDS){ stageSettle(); return; }
  document.getElementById("roundLabel").textContent=`청년기 ${round} / ${TOTAL_ROUNDS} 라운드`;
  const p=curP();
  renderRival(); renderBoard();
  document.getElementById("scene").style.display="none";
  if(p.childPos>=FINISH_CELL){ bonusActivity(p); return; }
  if(p.type==="user") showUserRoll(p); else showAiRoll(p);
}
function showUserRoll(p){
  busy=false; p=p||userP();
  setMid("🎲 내 차례",`현재 <b>${p.childPos+1}칸</b> · 도착까지 ${Math.max(0,FINISH_CELL-p.childPos)}칸`,"큰 버튼을 꾹 눌렀다 떼세요");
  document.getElementById("actionPanel").innerHTML=`
    <div class="roll-gauge" id="rollGauge"><div class="rg-perfect" id="rgPerfect"></div><div class="rg-good" id="rgGood"></div><div class="rg-marker" id="rgMarker"></div></div>
    <div class="roll-hint" id="rollHint">버튼을 꾹 누르면 게이지가 움직여요</div>
    <button class="btn btn-roll" id="rollBtn"><span class="dice-ico">🎲</span> 꾹 눌러 하루 시작</button>`;
  bindHoldRoll();
}
function doUserDice(v){
  if(busy) return; busy=true;
  const p=userP(); const steps=rollValue(v);
  const from=p.childPos, to=Math.min(FINISH_CELL,from+steps);
  p._lastSteps=steps; p._moveTarget=to; renderBoard();
  setMid("🎲 주사위 결과!",`<span class="big">+${steps}칸</span>${from+1}칸 → ${to+1}칸`,`타이밍 ${v.label}`);
  log(`🎲 <b>${p.name}</b> 주사위 +${steps}칸 (${v.label})`,"u");
  document.getElementById("actionPanel").innerHTML=`<div class="ap-label">말이 이동 중…</div>`;
  movePiece(p, steps, ()=>arriveCell(p));
}
function rollValue(v){
  // 고교와 동일한 방식: verdict가 실제로 확률을 바꾼다 (min(4)로 보너스가 증발하지 않도록)
  let s=rnd(1,3);
  if(v.key==="perfect" && Math.random()<0.55) s=Math.min(4,s+1);
  else if(v.key==="good" && Math.random()<0.32) s=Math.min(4,s+1);
  else if(v.key==="miss" && Math.random()<0.4) s=Math.max(1,s-1);
  return Math.max(1,s);
}
function aiTimingSkill(p){
  const b={stable:0.5,challenger:0.62,romantic:0.5,tycoon:0.6,grinder:0.66}[p.aiTrait]||0.5;
  return Math.max(0.3,Math.min(0.85, b+((p.stats.luck||50)-50)/200));
}
function showAiRoll(p){
  setMid(`🌸 ${p.name}의 차례`,`현재 <b>${p.childPos+1}칸</b>`,`${p.name}${jo(p.name,'이가')} 타이밍을 재는 중…`);
  document.getElementById("actionPanel").innerHTML=`<div class="wait-ai">🌸 ${p.name}${jo(p.name,'이가')} 주사위를 굴리는 중…</div>`;
  const skill=aiTimingSkill(p);
  setTimeout(()=>{
    const r=Math.random(); let key;
    if(r<skill*0.4)key="perfect"; else if(r<skill*0.4+0.35)key="good"; else if(r<skill*0.4+0.65)key="ok"; else key="miss";
    const v=Object.assign({key:key}, TVERDICT[key]);
    p.timingHistory.push({where:"주사위",key});
    const steps=rollValue(v); const from=p.childPos, to=Math.min(FINISH_CELL,from+steps);
    p._lastSteps=steps; p._moveTarget=to; renderBoard();
    setMid(`🌸 ${p.name} 이동`,`<span class="big">+${steps}칸</span>${from+1}칸 → ${to+1}칸`,`타이밍 ${v.label}`);
    log(`🌸 <b>${p.name}</b> 판정 ${v.label} · +${steps}칸`,"a");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}의 말이 이동 중…</div>`;
    movePiece(p, steps, ()=>arriveCell(p));
  }, 1100);
}
function movePiece(p, steps, cb){
  let remain=steps;
  function hop(){
    if(remain<=0 || p.childPos>=FINISH_CELL){
      p.youthPos=p.childPos; delete p._moveTarget; delete p._lastSteps; renderBoard();
      const c=document.getElementById(`cell${p.childPos}`); if(c){c.classList.remove("arrive");void c.offsetWidth;c.classList.add("arrive");}
      setTimeout(()=>{ cb&&cb(); },260); return;
    }
    p.childPos=Math.min(FINISH_CELL, p.childPos+1); remain--; p.youthPos=p.childPos;
    placeToken(p); highlightCells();
    const tok=document.getElementById(`tok_${p.id}`); if(tok){tok.classList.remove("hop");void tok.offsetWidth;tok.classList.add("hop");}
    setTimeout(hop,240);
  }
  hop();
}

  {good:true, ico:"🍀", txt:"네잎클로버를 주웠어요!", eff:{luck:3}},
  {good:true, ico:"🌈", txt:"왠지 오늘은 기분이 좋아요!", eff:{charm:2,luck:1}},

  {good:true, ico:"💪", txt:"기운이 솟아나요!", eff:{health:2,luck:1}},
  {good:true, ico:"🎈", txt:"좋은 소식을 들었어요!", eff:{relationship:2,luck:1}},
  {good:true, ico:"📖", txt:"우연히 배운 게 있어요!", eff:{intelligence:2}},
  {good:false, ico:"🪨", txt:"돌부리에 걸려 넘어졌어요.", eff:{health:-2}},
  {good:false, ico:"🌧️", txt:"갑자기 비를 맞았어요.", eff:{health:-1,luck:-1}},

  {good:true, ico:"✨", txt:"오늘따라 운이 확 트였어요!", eff:{luck:4,charm:1}},
  {good:true, ico:"🔁", txt:"신이 나서 한 걸음 더 — 한 턴 더!", bonus:"extra"}

function roadToast(ico, txt, good){
  const el=document.createElement("div"); el.className="road-toast "+(good?"good":"bad");
  el.innerHTML='<span class="rt-ico">'+ico+'</span> '+txt;
  document.body.appendChild(el);
  requestAnimationFrame(function(){el.classList.add("on");});
  setTimeout(function(){ el.classList.remove("on"); setTimeout(function(){el.remove();},300); }, 1500);
}
/* 길 위의 사건 — 가운데 무대에서 두 박자로 보여준다: ① 놀람("뭔가 있어요…") ② 공개.
   사용자가 [계속]을 눌러야 넘어가므로 순식간에 지나가지 않는다. */
function roadEventScene(p, ico, txt, good, sub, done){
  if(p.type!=="user"){
    if(typeof log==="function") log(ico+" <b>"+p.name+"</b> — "+txt, good?"u":"a");
    setTimeout(done, 600); return;
  }
  try{ showSceneMsg('<div class="hero-ava">'+charFace(p,"worried")+'</div>', "❓ 길 위에서", "어라, 뭔가 있어요…", "무슨 일일까요?"); }catch(e){}
  try{ setMid("❓ 길 위에서", '<span class="big">?</span>', "숨을 고르는 순간"); }catch(e){}
  try{ document.getElementById("actionPanel").innerHTML='<div class="ap-label">…</div>'; }catch(e){}
  setTimeout(function(){
    try{ showSceneMsg('<div class="hero-ava">'+charFace(p, good?"happy":"sad")+'</div>', (good?"✨ 길 위의 행운":"⚠️ 길 위의 사건"), ico+"  "+txt, sub||(good?"오늘은 운이 따랐어요":"오늘은 조금 아쉬웠어요")); }catch(e){}
    try{ setMid(good?"✨ 행운":"⚠️ 사건", '<span class="big">'+ico+'</span>', txt); }catch(e){}
    try{ if(good && typeof celebrate==="function") celebrate([ico,"✨","🍀"]); }catch(e){}
    window.__roadNext=function(){ window.__roadNext=null; done(); };
    try{ document.getElementById("actionPanel").innerHTML='<button class="btn btn-primary" onclick="__roadNext&&__roadNext()">계속 →</button>'; }catch(e){}
  }, 1100);
}
function rollRoadLuck(p, done){
  const chance = 0.13 + Math.max(0,(((p.stats&&p.stats.luck)||50)-50))*0.004;
  if(Math.random() > chance){ done(); return; }
  if(p.type==="user" && Math.random()<0.30 && typeof giveItem==="function"){
    const _id=randomItemId(); const _it=ITEMS[_id]; giveItem(p,_id);
    roadEventScene(p, _it.emoji, "길에서 "+_it.name+jo(_it.name,'을를')+" 주웠어요!", true, "가방에 넣어 뒀어요", done); return;
  }
  const pool = Math.random()<0.82 ? ROAD_LUCK.filter(function(r){return r.good;}) : ROAD_LUCK;
  const r = pick(pool);
  const applied = applyStat(p, Object.assign({}, r.eff||{}));
  if(r.money && typeof p.money==="number") p.money=(p.money||0)+r.money;
  if(r.bonus==="extra") p._extraTurn=true;
  if(typeof flashMini==="function") flashMini(p, applied);
  if(typeof renderRival==="function") renderRival();
  var _sub = (r.bonus==="extra") ? "한 번 더 굴릴 수 있어요!" : (r.money ? "용돈이 생겼어요" : ((typeof deltaStr==="function")?deltaStr(applied):""));
  roadEventScene(p, r.ico, r.txt, !!r.good, _sub, done);
}
function arriveCell(p){ rollRoadLuck(p, function(){ arriveCellReal(p); }); }
function arriveCellReal(p){
  // 주사위→이동 동안 걸어둔 잠금을 여기서 푼다. 이 시점부터 다시 선택을 받는다.
  busy=false;
  p.youthPos=p.childPos;
  const cell=YOUTH_BOARD[p.childPos];
  if(cell.type==="card"){ cardCell(p); return; }
  if(cell.type==="love"){ loveCell(p); return; }
  if(cell.type==="marry"){ marryCell(p); return; }
  sceneCell(p);
}
function sceneCell(p){
  // 칸 전용 풀에서 랜덤. 아이콘이 약속한 사건은 지키되, 매번 다른 이야기가 나온다.
  const pool=CELL_EVENTS[p.childPos];
  if(!pool||!pool.length){ console.warn("씬 없는 칸:",p.childPos,YOUTH_BOARD[p.childPos]); nextTurn(); return; }
  const sc=pick(pool);
  showSceneMsg(`<div class="hero-ava">${avaImg(p)}</div>`, sc.chip, sc.say, sc.sub);
  document.getElementById("turnCount").textContent = p.type==="user"?"내 선택":"상대 선택";
  if(p.type==="user"){
    setMid("🎯 선택의 순간","도착한 곳에서<br>무엇을 할까요?","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${sc.sub}</div>${choiceCardsHTML(sc.choices)}`;
    window._sc=sc; window._scP=p;
  }else{
    setMid(`🌸 ${p.name}의 선택`,"무엇을 할지<br>고민하고 있어요…","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'이가')} 무엇을 고를지 고민하고 있어요…</div>${choiceCardsHTML(sc.choices,{ai:true})}`;
    const idx=aiChoiceIndex(p, sc.choices);
    setTimeout(()=>{
      document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'은는')} 「${sc.choices[idx].text}」${jo(sc.choices[idx].text,'을를')} 선택했어요</div>${choiceCardsHTML(sc.choices,{ai:true,picked:idx})}`;
      applyChoiceResult(p, sc, idx, true);
    }, 1000);
  }
}
function chooseScene(i){ if(busy) return; busy=true; applyChoiceResult(window._scP, window._sc, i, false); }
function applyChoiceResult(p, sc, i, isAi){
  const c=sc.choices[i];
  const eff=Object.assign({}, c.eff||{});
  // 돈은 eff.money(기존 청년기 씬)와 c.money(칸별 신규 씬) 양쪽에서 온다
  const money = (eff.money||0) + (c.money||0); delete eff.money;
  const applied=applyStat(p, eff);
  if(money){ p.money=clampMoney((p.money||0)+money); }
  if(c.flag){ p.eventFlags[c.flag]=true; }
  if(c.career){ p.careerLevel=(p.careerLevel||0)+c.career; }
  if(c.burnout){ p.burnoutLevel=(p.burnoutLevel||0)+c.burnout; }
  if(c.aff){ addAff(p, p.currentPartnerId, queenAff(p, c.aff)); }   // 👑 여왕벌: 호감 1.5배
  if(c.lotto){
    const win = Math.random() < 0.08 + (p.stats.luck-50)*0.002;
    if(win){ p.money=clampMoney((p.money||0)+300); log(`🎫 <b>${p.name}</b> — 복권 당첨! <small>자산+300</small>`); }
  }
  const who = p.type==="user" ? "🙂" : "🌸";
  const npcEl=document.getElementById("npcFace");
  if(npcEl && c.aff!==undefined){
    // 데이트 중 — 두 얼굴을 지우지 않고 각각 갱신 (상대 반응이 선택마다 달라진다)
    const npc=crushOf(p);
    npcEl.innerHTML=imgTag(npcFace(npc, (c.aff||0)>=9?"happy":(c.aff||0)<0?"sad":(c.mood||"normal")), npc.baseFallback||"🙂","height:100%;width:auto;object-fit:contain");
    npcEl.classList.remove("glow","dim");
    if((c.aff||0)>=9) npcEl.classList.add("glow"); else if((c.aff||0)<0) npcEl.classList.add("dim");
  } else {
    setHeroFace(p, moodFromApplied(applied, c.mood||sc.mood));
  }
  document.getElementById("sceneSay").innerHTML = isAi?`${p.name}${jo(p.name,'은는')} 「${c.text}」${jo(c.text,'을를')} 선택했어요.`:c.res;
  document.getElementById("sceneSub").innerHTML = deltaStr(applied, money);
  log(`${who} <b>${p.name}</b> — ${c.res} ${deltaStr(applied, money)}`, isAi?"a":"u");
  floatStat(applied, money); flashMini(p, applied);
  renderRival(); savePlayers();
  // 결과를 읽을 시간을 준다 (600ms면 결과 문장이 보이기도 전에 사라졌다)
  setTimeout(()=>{ busy=false; nextTurn(); }, isAi?1500:1400);
}

/* ── 연애 셀 ── */
/* 연애 4단계는 칸이 결정한다: 💗첫 데이트(3) → 💕연애(10) → 💍프러포즈(17) → 💔권태기(23).
   아이콘이 약속한 단계가 그대로 온다. */
const LOVE_CELL_STAGE = { 3:"date", 10:"dating", 17:"propose", 23:"slump" };
/* ── 데이트 장소 ── 화려한 곳일수록 호감이 크게 오르지만 지갑이 얇아진다. */
const YOUTH_DATE_PLACES = [
  {text:"근사한 맛집", ai:"🍽️", aff:9,  eff:{charm:2,money:-50},           mood:"happy",  res:"분위기 좋은 곳에서 마주 앉았어요."},
  {text:"함께 여행",   ai:"✈️", aff:14, eff:{charm:3,health:1,money:-120}, mood:"happy",  res:"둘만의 여행, 평생 갈 추억이 됐어요."},
  {text:"전시회",     ai:"🎨", aff:7,  eff:{charm:1,intelligence:2,money:-20}, mood:"normal", res:"조용히 걸으며 취향을 나눴어요."}
];
function youthDateCell(p, npc){
  const av=youthAvatar(p);
  const heroHTML=`<div class="romance-faces"><div class="rf-me" id="meFace">${imgTag(av.image,av.fallback,"height:100%;width:auto;object-fit:contain")}</div><div class="rf-heart beat">💗</div><div class="rf-npc" id="npcFace">${imgTag(npcFace(npc,"normal"),npc.baseFallback||"🙂","height:100%;width:auto;object-fit:contain")}</div></div>`;
  const sc={ chip:`💗 ${npc.name}와 데이트`, say:`${npc.name}${jo(npc.name,'와과')} 어디로 데이트 갈까요?`, sub:"화려한 곳일수록 마음은 가까워지지만 지갑은 얇아져요", choices:YOUTH_DATE_PLACES };
  showSceneMsg(heroHTML, sc.chip, sc.say, sc.sub);
  document.getElementById("turnCount").textContent = p.type==="user"?"연애":"상대 연애";
  if(p.type==="user"){
    setMid("💗 데이트","어디로<br>갈까요?","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${sc.sub}</div>${choiceCardsHTML(sc.choices)}`;
    window._sc=sc; window._scP=p;
  }else{
    setMid(`🌸 ${p.name}의 데이트`,"어디로 갈지<br>고민 중이에요…","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'이가')} 데이트 장소를 고르고 있어요…</div>${choiceCardsHTML(sc.choices,{ai:true})}`;
    const idx=aiChoiceIndex(p, sc.choices);
    setTimeout(()=>{ document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'은는')} 「${sc.choices[idx].text}」${jo(sc.choices[idx].text,'을를')} 골랐어요</div>${choiceCardsHTML(sc.choices,{ai:true,picked:idx})}`; applyChoiceResult(p, sc, idx, true); }, 1000);
  }
}
/* 청혼 기회: 시대마다 두 번까지, 한 번 거절당하면 3라운드는 마음을 추스른다.
   (예전엔 시대당 한 번뿐이라 성공률 40%짜리 한 번에 결혼이 갈렸다 — 가정형 봇 4판 결혼 0%) */
function canPropose(p){
  const n=(p.proposeCount&&p.proposeCount[STAGE_KEY])||0;
  return n<2 && (p.proposeLastRound==null || p.proposeLastAt!==STAGE_KEY || round-p.proposeLastRound>=3);
}
function markPropose(p){
  p.proposeCount=p.proposeCount||{}; p.proposeCount[STAGE_KEY]=(p.proposeCount[STAGE_KEY]||0)+1;
  p.proposeLastRound=round; p.proposeLastAt=STAGE_KEY;
}
function loveCell(p){
  const phase=LOVE_CELL_STAGE[p.childPos]||"date";
  if(p.isMarried){ marriedLifeCell(p); return; }
  // 청혼할 수 있는 사람이 있으면 💍칸이 아니어도 연애 칸에서 청혼 기회가 온다
  // (예전엔 💍칸에 정확히 멈춰야만 열려서, 봇 3판 내내 아무도 결혼하지 못했다)
  if(canPropose(p) && marriageCandidates(p).length && (phase==="propose" || Math.random()<0.6)){ proposeCell(p); return; }
  if((phase==="date"||phase==="dating") && typeof youthDateCell==="function"){ youthDateCell(p, crushOf(p)); return; }
  sceneCell(p);
}
function marriedLifeCell(p){
  const npc=npcOf(p.spouseId);
  const sc={ chip:"결혼 생활", say:`${p.spouseName}와 함께하는 날이에요`, sub:"관계는 저절로 유지되지 않아요",
    choices:[
      { text:"시간을 함께 보낸다", ai:"💞", aff:8, eff:{relationship:4, money:-25}, res:"가까워졌어요" },
      { text:"일에 집중한다", ai:"💼", aff:-7, eff:{money:45, intelligence:3}, res:"통장은 늘고 거리는 멀어졌어요" },
      { text:"적당히 균형", ai:"⚖️", aff:1, eff:{health:2, money:10}, res:"무난한 하루였어요" }
    ] };
  showSceneMsg(`<div class="hero-ava">${imgTag(npcFace(npc,"happy"),"💞","max-height:150px")}</div>`, sc.chip, sc.say, sc.sub);
  if(p.type==="user"){
    setMid("💞 결혼 생활","오늘은<br>어떻게 보낼까요?","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${sc.sub}</div>${choiceCardsHTML(sc.choices)}`;
    window._sc={chip:sc.chip, choices:sc.choices, spouse:true}; window._scP=p;
  }else{
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'이가')} 고민하고 있어요…</div>${choiceCardsHTML(sc.choices,{ai:true})}`;
    const idx=aiChoiceIndex(p, sc.choices);
    setTimeout(()=>{
      document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'은는')} 「${sc.choices[idx].text}」${jo(sc.choices[idx].text,'을를')} 선택했어요</div>${choiceCardsHTML(sc.choices,{ai:true,picked:idx})}`;
      const c=sc.choices[idx];
      if(c.aff) addAff(p, p.spouseId, c.aff);
      applyChoiceResult(p, sc, idx, true);
    }, 1000);
  }
}

/* ── 프러포즈 ── */
function proposeCell(p){
  const cands=marriageCandidates(p);
  if(p.type!=="user"){ aiPropose(p); return; }
  const top=cands[0];
  p.proposeTried=true; p.proposeTriedAt=STAGE_KEY; markPropose(p);
  const choices=[
    { text:`${top.npc.name}에게 청혼한다`, ai:"💍", propose:top.npc.id },
    { text:"아직은 이르다", ai:"⏳", propose:null }
  ];
  showSceneMsg(`<div class="hero-ava">${imgTag(npcFace(top.npc,"happy"),"💗","max-height:150px")}</div>`,
    "프러포즈", `${top.npc.name}와 오래 함께했어요`, "지금 결혼하면 자녀가 일찍 자랍니다");
  setMid("💍 결정","인생에서<br>가장 큰 선택 중 하나","");
  document.getElementById("actionPanel").innerHTML=
    `<div class="ap-label">${twoTimingCount(p)>=2?"⚠️ 마음을 나눠준 사람이 여럿이에요":"오래 쌓아온 마음이에요"}</div>${choiceCardsHTML(choices,{handler:"choosePropose"})}`;
  window._proposeChoices=choices;
}
function choosePropose(i){
  if(busy) return; busy=true;
  const u=userP(); const c=window._proposeChoices[i];
  if(!c.propose){ log(`⏳ <b>${u.name}</b> — 결혼은 조금 더 뒤로 미뤘어요`); busy=false; nextTurn(); return; }
  const npc=npcOf(c.propose);
  const aff=affOf(u,c.propose);
  let pr = 0.38 + (aff-60)*0.012 + (u.stats.charm-50)*0.004 + (u.stats.relationship-50)*0.004;
  const ch=getChar(u); if(ch&&ch.passive&&ch.passive.loveBonus) pr+=ch.passive.loveBonus;
  if(twoTimingCount(u)>=2) pr-=0.22;   // 양다리는 청혼에서 대가를 치른다
  if(queenActive(u)){ pr+=0.18; u.queenBeeRounds--; renderBag(); }   // 👑 여왕벌: 청혼 성공률↑
  runTiming({kind:"청혼", icon:"💍", title:"진심을 전하는 순간", desc:"말할 <b>타이밍</b>이 전부일 때가 있어요.", accent:"var(--pink)"}, function(v){
    const ok = Math.random() < Math.max(0.05, Math.min(0.95, pr+v.bonus));
    if(ok){ doMarry(u, npc, "youth"); showProposeResult(u, npc, true, v); }
    else{ addAff(u, npc.id, -18); applyStat(u,{health:-4, charm:-3}); showProposeResult(u, npc, false, v); }
  });
}
function showProposeResult(p, npc, ok, v){
  const mood = ok? "happy":"sad";
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:${ok?"var(--pink)":"var(--muted)"}">💍 청혼</span>
    <h2>${ok?"승낙받았어요!":"거절당했어요"}</h2>
    <div style="margin:12px 0">${imgTag(npcFace(npc,mood), ok?"💞":"🥲", "max-height:140px")}</div>
    <p class="m-desc">${ok
      ? `<b>${npc.name}</b>${jo(npc.name,'와과')} 결혼했어요.<br>청년기에 가정을 이루면 자녀가 일찍 자라, <b>노년에 용돈을 오래 받습니다.</b><br><small>결혼식 비용 ${WEDDING_COST} · 축의금 +${p.weddingGiftTotal}</small>`
      : `마음이 닿지 않았어요. <small>${v.label}</small>`}</p>
    <button class="btn btn-primary" style="margin-top:12px" onclick="closeModalNext()">계속 →</button>`;
  document.getElementById("modalOverlay").classList.add("on");
  renderRival(); savePlayers();
}
function closeModalNext(){
  document.getElementById("modalOverlay").classList.remove("on");
  busy=false; nextTurn();
}
function doMarry(p, npc, at){
  p.isMarried=true; p.hasPartner=true;
  p.spouseId=npc.id; p.spouseName=npc.name; p.spouseJob=npc.secretJob;
  p.marriedAt=at; p.currentPartnerId=npc.id;
  p.marriageHistory=p.marriageHistory||[];
  p.marriageHistory.push({stage:at, npc:npc.id, round:round});
  // 축의금: 인간관계 + 어릴 때 쌓은 친구 flag (카드 설명에 '축의금 보너스'가 예고돼 있음)
  const f=p.eventFlags||{};
  const gift = Math.max(0, 60 + (p.stats.relationship-50)*2 + (f.manyFriends?40:0) + (f.goodFriend?30:0) + (f.teacherPraise?15:0));
  p.weddingGiftTotal=gift;
  p.money=clampMoney((p.money||0) - WEDDING_COST + gift);
  p.childEventUnlocked=true;
  log(`💍 <b>${p.name}</b> — ${npc.name}${jo(npc.name,'와과')} 결혼했어요 <small>(비용 ${WEDDING_COST}, 축의금 +${gift})</small>`);
}
function aiPropose(a){
  a.proposeTried=true; a.proposeTriedAt=STAGE_KEY; markPropose(a);
  const cands=marriageCandidates(a);
  const wantsIt = (a.aiTrait==="romantic") || (a.aiTrait==="stable" && Math.random()<0.6) || Math.random()<0.3;
  if(cands.length && wantsIt && Math.random()<0.6){ doMarry(a, cands[0].npc, "youth"); }
  else log(`⏳ <b>${a.name}</b> — 아직 결혼 생각은 없어 보여요`);
  renderRival(); savePlayers();
  setTimeout(()=>{ busy=false; nextTurn(); }, 700);
}

/* ── 결혼 이야기 셀 ── */
function marryCell(p){
  if(p.isMarried){ marriedLifeCell(p); return; }
  sceneCell(p);
}

/* ── 카드 ── */
/* 청년기 판에는 청년기 카드만. habit(초등 전용)은 뽑지 않는다. */
function youthCardPool(){ return cardPool(["youthlife","talent","growth","bond","luck"]); }
function cardCell(p){
  // 무대도 카드 칸으로 갈아준다 (안 하면 이전 칸의 씬이 그대로 남는다)
  showSceneMsg(`<div class="hero-ava">${avaImg(p)}</div>`, "🎴 기회 카드",
    "예상 못 한 기회가 찾아왔어요.",
    p.type==="user" ? "카드 한 장을 골라보세요." : `${p.name}${jo(p.name,'이가')} 카드를 고르는 중…`);
  if(p.type==="user"){
    setMid("🎴 기회 카드","기회가<br>찾아왔어요","");
    drawCards(youthCardPool(), 3, function(card){
      const applied=applyStat(p, card.effect||{});
      if(card.flag){ p.eventFlags[card.flag]=true; }
      p.youthCards=p.youthCards||[]; p.youthCards.push(card.id);
      log(`🎴 <b>${p.name}</b> — 「${card.name}」 ${deltaStr(applied)}`);
      renderRival(); savePlayers();
      busy=false; nextTurn();
    });
  }else{
    aiCardShow(p, youthCardPool(), function(card){
      const applied=applyStat(p, card.effect||{});
      if(card.flag){ p.eventFlags[card.flag]=true; }
      log(`🎴 <b>${p.name}</b> — 「${card.name}」 ${deltaStr(applied)}`,"a");
      flashMini(p, applied); renderRival(); savePlayers();
      return deltaStr(applied);
    }, function(){ busy=false; nextTurn(); });
  }
}

/* ── 보너스 (먼저 도착한 뒤) ── */
function bonusActivity(p){
  const choices=[
    { text:"부업을 한다", ai:"💰", eff:{money:40, health:-3}, res:"조금 더 벌었어요" },
    { text:"몸을 챙긴다", ai:"🏃", eff:{health:5}, res:"컨디션이 좋아졌어요" },
    { text:"사람을 만난다", ai:"☕", eff:{relationship:5, money:-15}, res:"좋은 시간이었어요" }
  ];
  const sc={chip:"남은 시간", choices:choices};
  showSceneMsg(`<div class="hero-ava">${avaImg(p)}</div>`, "남은 시간", "서른까지 남은 시간이에요", "무엇을 해볼까요?");
  if(p.type==="user"){
    setMid("⭐ 남은 시간","무엇을<br>해볼까요?","");
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">남은 시간에 무엇을 해볼까요?</div>${choiceCardsHTML(choices)}`;
    window._sc=sc; window._scP=p;
  }else{
    document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'이가')} 고민하고 있어요…</div>${choiceCardsHTML(choices,{ai:true})}`;
    const idx=aiChoiceIndex(p, choices);
    setTimeout(()=>{
      document.getElementById("actionPanel").innerHTML=`<div class="ap-label">${p.name}${jo(p.name,'은는')} 「${choices[idx].text}」${jo(choices[idx].text,'을를')} 선택했어요</div>${choiceCardsHTML(choices,{ai:true,picked:idx})}`;
      applyChoiceResult(p, sc, idx, true);
    }, 900);
  }
}

/* ── 라운드 정산 ── */
function nextTurn(){
  busy=false;
  document.getElementById("scene").style.display="none";
  var _cur=players[turnIdx]; if(_cur && _cur._extraTurn){ _cur._extraTurn=false; beginTurn(); return; }
  if(turnIdx===1){ showRoundSummary(); return; }
  turnIdx=1; beginTurn();
}
function settleRoundIncome(p){
  const inc=roundIncome(p);
  p.money=clampMoney((p.money||0)+inc.net);
  p.youthIncomeTotal=(p.youthIncomeTotal||0)+Math.max(0,inc.salary+inc.side);
  p.totalSalaryEarned=(p.totalSalaryEarned||0)+inc.salary;
  // 결혼했으면 배우자 수입 + 호감도 자연 감소
  if(p.isMarried){
    const sj=JOBS.find(j=>j.name===p.spouseJob);
    const sp=sj? Math.round((sj.baseSalary||0)*0.5) : 12;
    p.money=clampMoney((p.money||0)+sp);
    addAff(p, p.spouseId, -2);
  }
  // 양다리 발각
  if(!p.isMarried && twoTimingCount(p)>=2 && Math.random()<0.25){
    p.twoTimingCaught=(p.twoTimingCaught||0)+1;
    p.romanceReputationRisk=(p.romanceReputationRisk||0)+1;
    for(const id in p.affinity){ if(p.affinity[id]>=TWO_TIME_LINE) p.affinity[id]=Math.max(0,p.affinity[id]-30); }
    applyStat(p,{relationship:-10, charm:-4});
    log(`💔 <b>${p.name}</b> — 마음을 나눈 게 들켰어요… <small>모두의 호감도가 떨어졌어요</small>`);
  }
  return inc;
}
function showRoundSummary(){
  const u=userP(), a=aiP();
  const iu=settleRoundIncome(u), ia=settleRoundIncome(a);
  renderRival(); savePlayers(); saveGameState();
  const line=(p,inc)=>`<div class="rule"><span class="ri">${p.type==="user"?"🙂":"🌸"}</span><span><b>${p.name}</b> — ${jobFeel(p)}<br>
    <small>월급 ${inc.salary} · 재능 부수입 ${inc.side} · 생활비 -${inc.cost} → <b>${inc.net>=0?"+":""}${inc.net}</b> · ${moneyFeel(p)}</small></span></div>`;
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:var(--blue)">📅 라운드 ${round}</span>
    <h2>한 해가 지나갔어요</h2>
    <div class="rule-grid">${line(u,iu)}${line(a,ia)}</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="startNextRound()">다음 해로 →</button>`;
  document.getElementById("modalOverlay").classList.add("on");
}
function startNextRound(){
  document.getElementById("modalOverlay").classList.remove("on");
  round++; turnIdx=0; busy=false;
  if(round>TOTAL_ROUNDS){ stageSettle(); return; }
  beginTurn();
}

/* ── 스테이지 정산 ── */
function youthTitle(p){
  if(p.isMarried && p.job) return "가정과 일을 모두 잡은 청년";
  if(p.isMarried) return "사랑을 먼저 택한 청년";
  if(p.job && (p.money||0)>=400) return "빠르게 자리 잡은 청년";
  if(p.job) return "제 몫을 하는 청년";
  return "아직 길을 찾는 중인 청년";
}
function stageSettle(){
  players.forEach(p=>{
    p.stageDone=p.stageDone||{}; p.stageDone.youth=true;
    p.youthPos=p.childPos;
    p.stagePerformance=p.stagePerformance||{};
    p.stagePerformance.youth={ money:p.money||0, job:p.jobName||null, married:!!p.isMarried, marriedAt:p.marriedAt||null };
    p.youthSummaryLine=youthTitle(p);
    p.chapterSummaries=p.chapterSummaries||[];
    p.chapterSummaries.push({stage:"youth", title:youthTitle(p), money:p.money||0, job:p.jobName||"무직", married:!!p.isMarried});
  });
  GS.currentStage="adult";
  savePlayers(); saveGameState();
  const u=userP(), a=aiP();
  const card=(p)=>{
    const av=youthAvatar(p);
    const k=topTalent(p);
    return `<div class="settle-person ${p.type}">
      <div class="settle-face">${imgTag(av.image, av.fallback, "max-height:130px")}</div>
      <div class="settle-name">${p.type==="user"?"🙂":"🌸"} ${p.name}</div>
      <div class="rc-sub">${youthTitle(p)}</div>
      <div class="rc-sub">${jobFeel(p)}</div>
      <div class="rc-sub">${moneyFeel(p)}</div>
      <div class="rc-sub">${p.isMarried? `💍 ${p.spouseName}` : "미혼"}</div>
      <div class="rc-sub">${k? `${TALENT_CATEGORIES[k].emoji} ${TALENT_CATEGORIES[k].name} ${TALENT_STAR[talentLevel(p,k)]}` : "재능 없음"}</div>
    </div>`;
  };
  document.getElementById("modal").innerHTML=`
    <span class="m-type" style="background:var(--purple)">🎓 청년기 정산</span>
    <h2>서른이 되었어요</h2>
    <p class="m-desc">이십 대가 지나갔어요. 지금 쥔 것이 다음 삼십 년의 출발점이 됩니다.</p>
    <div class="settle-duo">${card(u)}${card(a)}</div>
    <button class="btn btn-primary" style="margin-top:14px" onclick="goNextStage('${STAGE_NEXT}')">성인기로 →</button>`;
  document.getElementById("modalOverlay").classList.add("on");
}

window.onload=init;
</script>
